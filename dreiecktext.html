<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Textaufgaben: Umfang & Flächeninhalt am Dreieck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdfdf9; --grid:#d6e4f2; --ink:#1b2a4a; --pen:#1d4ed8; --muted:#5b6b85;
  --red:#c62828; --red-soft:#fdecea; --green:#2e7d32; --green-soft:#e6f4e7;
  --marker:#ffe36e; --tri:#eaf1fb; --card:#ffffff; --line:#c9d6e6; --btn:#1b2a4a; --btn-ink:#ffffff;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151b26; --grid:#222d3e; --ink:#e6ecf5; --pen:#8fb1ff; --muted:#9aa8bf;
    --red:#ff7a7a; --red-soft:#3a1e22; --green:#6fd17a; --green-soft:#17301c;
    --marker:#7a6516; --tri:#1e2a3e; --card:#1b2231; --line:#33415a; --btn:#e6ecf5; --btn-ink:#151b26;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif; font-size:17px; line-height:1.5;
  padding-bottom:260px;
}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 60px}
header h1{font-family:"Patrick Hand",cursive;font-weight:400;font-size:clamp(32px,5.5vw,48px);line-height:1.05;margin:0 0 6px;color:var(--pen)}
header p{margin:0 0 20px;color:var(--muted);max-width:65ch}
.controls{display:flex;flex-direction:column;gap:12px;margin-bottom:22px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px}
.ctl-label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px}
.namein{font:inherit;font-size:16px;padding:7px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);width:260px;max-width:100%}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.sheet{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px}
.task{font-size:19px;margin:0 0 12px;line-height:1.4}
.task b{font-family:"Patrick Hand",cursive;font-size:24px;color:var(--pen);font-weight:400}
svg{width:100%;height:auto;display:block}
.side{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.side.height-line{stroke:var(--red);stroke-width:2.5;stroke-dasharray:6 4}
.tri{fill:var(--tri)}
.ra{fill:none;stroke:var(--ink);stroke-width:2}
.dot{fill:var(--ink)}
.lbl{font-family:"Patrick Hand",cursive;font-size:19px;fill:var(--ink)}
.way-title{margin:18px 0 4px;font-size:15px;color:var(--muted)}
.way{font-family:"Patrick Hand",cursive;font-size:23px;line-height:1.5;color:var(--pen);min-height:44px;border-left:3px solid var(--pen);padding-left:14px}
.way:empty::before{content:"Hier entsteht dein Rechenweg.";color:var(--muted);font-size:18px}
.wline{animation:write .35s ease-out}
@keyframes write{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.wline.final{display:inline-block;border-bottom:3px double var(--pen);margin-top:2px;font-weight:bold}
.steps{display:flex;flex-direction:column;gap:12px}
.step{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.step.solved{border-color:var(--green)}
.step-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:15px}
.step.solved .num{background:var(--green);border-color:var(--green);color:var(--card)}
.step h3{margin:0;font-size:18px}
.step p{margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-family:"Patrick Hand",cursive;font-size:21px;min-width:56px;padding:4px 14px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){background:var(--tri)}
.opt.good{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.opt.wrongb{background:var(--red-soft);border-color:var(--red);color:var(--red);text-decoration:line-through}
.opt:disabled{cursor:default}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:"Patrick Hand",cursive;font-size:23px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px}
.frac-top{border-bottom:2px solid var(--ink);padding-bottom:2px;display:flex;align-items:center;gap:4px}
.frac-bot{padding-top:2px;display:flex;align-items:center;justify-content:center}
.n{font:inherit;font-family:"Patrick Hand",cursive;font-size:21px;width:75px;padding:2px 4px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--pen);text-align:center}
.n:focus{outline:3px solid var(--pen)}
.n.wide{width:110px}
.check,.next{font:inherit;font-size:16px;font-weight:700;padding:8px 16px;border-radius:10px;border:0;background:var(--btn);color:var(--btn-ink);cursor:pointer}
.fb{font-size:15px;margin-top:8px}
.fb:empty{display:none}
.fb.bad{color:var(--red);background:var(--red-soft);padding:8px 10px;border-radius:8px}
.fb.ok{color:var(--green)}
.score{font-size:15px;color:var(--muted);margin:0 0 12px}
.namerow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.summary{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:20px}
.summary h2{font-family:"Patrick Hand",cursive;font-size:32px;color:var(--pen);margin:0 0 14px}
.tablewrap{overflow-x:auto;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.tag{font-size:14px;color:var(--muted);font-weight:bold}
.homework-box{background:var(--tri);border:2px dashed var(--pen);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:15px}
.homework-box h4{margin:0 0 6px;color:var(--pen);font-size:17px}
.codebox{background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:8px 12px;font-family:monospace;font-size:18px;font-weight:bold;color:var(--pen);display:inline-block;margin:6px 0}
.keypad{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:3px solid var(--pen);padding:10px 14px;box-shadow:0 -4px 20px rgba(0,0,0,0.15);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:999}
.keypad-header{display:flex;justify-content:space-between;width:100%;max-width:360px;font-size:14px;font-weight:bold;color:var(--muted)}
.keypad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:360px}
.keybtn{font-family:"Patrick Hand",cursive;font-size:24px;padding:8px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer;text-align:center}
.keybtn:active{background:var(--tri)}
.keybtn.action{background:var(--btn);color:var(--btn-ink);font-size:18px;font-family:sans-serif}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Textaufgaben: Dreiecke in der Praxis</h1>
    <p>Berechne Umfang, Flächeninhalt und Folgekosten bei Sachaufgaben aus dem Alltag. (6 Schulübungen & 4 Hausübungen)</p>
  </header>

  <div class="controls">
    <div>
      <label class="ctl-label" for="name">1. Dein Name</label>
      <div class="namerow">
        <input id="name" class="namein" placeholder="Vor- und Nachname">
        <button class="next" id="nameOk">Starten</button>
      </div>
    </div>
    <div style="border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px;">
      <label class="ctl-label" for="codeInp">2. Bereits einen Speicher-Code von einem anderen Gerät?</label>
      <div class="namerow">
        <input id="codeInp" class="namein" placeholder="Zahlencode eingeben" inputmode="numeric">
        <button class="next" id="codeOk" style="background:var(--muted)">Fortschritt laden</button>
      </div>
    </div>
  </div>

  <p class="score" id="score">Gelöst: 0 von 10, davon fehlerfrei: 0</p>

  <div class="grid">
    <div class="sheet">
      <p class="task" id="taskText"></p>
      <div id="fig"></div>
      <p class="way-title">Rechenweg</p>
      <div class="way" id="way"></div>
    </div>
    <div>
      <div class="steps" id="steps"></div>
      <div class="done" id="done" hidden style="margin-top:16px;">
        <p id="doneText" style="font-size:18px; margin-bottom:12px;"></p>
        <button class="next" id="nextBtn">Nächste Aufgabe</button>
      </div>
    </div>
  </div>

  <section class="summary" id="summary" hidden></section>
</div>

<div class="keypad" id="keypad" hidden>
  <div class="keypad-header">
    <span>Eingabe über Tastatur / Touch</span>
    <span style="cursor:pointer; color:var(--red)" onclick="closeKeypad()">✕ Schließen</span>
  </div>
  <div class="keypad-grid">
    <button class="keybtn" onclick="keyPress('7')">7</button>
    <button class="keybtn" onclick="keyPress('8')">8</button>
    <button class="keybtn" onclick="keyPress('9')">9</button>
    <button class="keybtn" onclick="keyPress('4')">4</button>
    <button class="keybtn" onclick="keyPress('5')">5</button>
    <button class="keybtn" onclick="keyPress('6')">6</button>
    <button class="keybtn" onclick="keyPress('1')">1</button>
    <button class="keybtn" onclick="keyPress('2')">2</button>
    <button class="keybtn" onclick="keyPress('3')">3</button>
    <button class="keybtn" onclick="keyPress(',')">,</button>
    <button class="keybtn" onclick="keyPress('0')">0</button>
    <button class="keybtn action" onclick="keyPress('back')">⌫</button>
  </div>
</div>

<script>
const TOTAL_TASKS = 10;
const PRESETS = [
  // --- SCHULÜBUNG (6 Aufgaben) ---
  { 
    section: 'Schulübung', roundNum: 1, roundMax: 3,
    title: 'Waldstück aufforsten', 
    type: 'general', a: 900, b: 1400, c: 1600, h: 800, unit: 'm',
    text: 'Ein dreieckiges Waldstück soll mit Fichten neu aufgeforstet werden. Wie groß ist die Fläche A in m² und wie teuer ist das Holz, wenn 1 m² Fichtenpflanzen 2,50 € kosten?',
    costPerUnit: 2.50, costName: 'Gesamtkosten', costUnit: '€', costType: 'A'
  },
  { 
    section: 'Schulübung', roundNum: 2, roundMax: 3,
    title: 'Hausgiebel verschalen', 
    type: 'general', a: 800, b: 800, c: 1480, h: 680, unit: 'cm',
    text: 'Der Giebel eines Hauses soll mit Holz verschalt werden. Grundseite c = 14,8 m (1480 cm) und Höhe h = 6,8 m (680 cm). Berechne den Flächeninhalt A in m² (1 m² = 10 000 cm²). Wie viel kostet das Holz bei 38 € pro m²?',
    costPerUnit: 38, costName: 'Holzkosten', costUnit: '€', costType: 'A', convertToM2: true
  },
  { 
    section: 'Schulübung', roundNum: 3, roundMax: 3,
    title: 'Kirchturmdach neu decken', 
    type: 'general', a: 720, b: 720, c: 450, h: 700, unit: 'cm',
    text: 'Ein Kirchturmdach besteht aus 4 gleichen dreieckigen Flächen (c = 4,5 m = 450 cm, h = 7 m = 700 cm). Berechne die Fläche EINER Dreiecksseite A in m² und danach die Gesamtkosten für alle 4 Flächen bei 280 € pro m²!',
    costPerUnit: 280, costName: 'Gesamtkosten (4 Flächen)', costUnit: '€', costType: 'A_multi', multiplier: 4, convertToM2: true
  },
  { 
    section: 'Schulübung', roundNum: 4, roundMax: 6,
    title: 'Rechtwinkliges Blumenbeet', 
    type: 'right', a: 6, b: 8, c: 10, unit: 'm',
    text: 'Ein rechtwinkliges Blumenbeet mit den Katheten a = 6 m und b = 8 m soll mit Platten eingefasst werden. Berechne den Umfang u in m und den Preis für den Zaun/Randstein bei 15 € pro Meter.',
    costPerUnit: 15, costName: 'Einfassungskosten', costUnit: '€', costType: 'u'
  },
  { 
    section: 'Schulübung', roundNum: 5, roundMax: 6,
    title: 'Sonnensegel für den Garten', 
    type: 'right', a: 3, b: 4, c: 5, unit: 'm',
    text: 'Ein rechtwinkliges Sonnensegel besitzt die Katheten 3 m und 4 m. Wie viel m² Stoff A werden benötigt und was kostet das Segel bei 22 € pro m²?',
    costPerUnit: 22, costName: 'Segelkosten', costUnit: '€', costType: 'A'
  },
  { 
    section: 'Schulübung', roundNum: 6, roundMax: 6,
    title: 'Dreieckiger Parkteich (Zaun)', 
    type: 'general', a: 35, b: 42, c: 50, h: 28, unit: 'm',
    text: 'Ein Ententeich im Park ist dreieckig abgegrenzt (a = 35 m, b = 42 m, c = 50 m). Wie lang ist der Sicherheitszaun um den gesamten Teich (Umfang u) und was kostet der Zaun bei 18 € / m?',
    costPerUnit: 18, costName: 'Zaunkosten', costUnit: '€', costType: 'u'
  },

  // --- HAUSÜBUNG (4 Aufgaben) ---
  { 
    section: 'Hausübung', roundNum: 1, roundMax: 4,
    title: 'Gartengrundstück einzäunen', 
    type: 'general', a: 24, b: 30, c: 36, h: 20, unit: 'm',
    text: 'HÜ 1: Ein dreieckiger Garten (a = 24 m, b = 30 m, c = 36 m, h = 20 m) erhält einen neuen Maschendrahtzaun. Berechne den Umfang u und die Zaunkosten bei 12 € pro Meter.',
    costPerUnit: 12, costName: 'Zaunkosten', costUnit: '€', costType: 'u'
  },
  { 
    section: 'Hausübung', roundNum: 2, roundMax: 4,
    title: 'Rechtwinklige Dachfläche', 
    type: 'right', a: 9, b: 12, c: 15, unit: 'm',
    text: 'HÜ 2: Eine rechtwinklige Dachfläche hat die Katheten 9 m und 12 m. Berechne die Fläche A in m² und die Eindeckungskosten bei 45 € pro m².',
    costPerUnit: 45, costName: 'Dachkosten', costUnit: '€', costType: 'A'
  },
  { 
    section: 'Hausübung', roundNum: 3, roundMax: 4,
    title: 'Bauplatz Raseneinsaat', 
    type: 'general', a: 18, b: 22, c: 25, h: 16, unit: 'm',
    text: 'HÜ 3: Auf einem dreieckigen Bauplatz (c = 25 m, h = 16 m) soll Rasen gesät werden. Berechne die Fläche A in m² und die Saatgutkosten bei 1,50 € pro m².',
    costPerUnit: 1.5, costName: 'Saatgutkosten', costUnit: '€', costType: 'A'
  },
  { 
    section: 'Hausübung', roundNum: 4, roundMax: 4,
    title: 'Verkehrsschild streichen', 
    type: 'right', a: 60, b: 80, c: 100, unit: 'cm',
    text: 'HÜ 4: Ein rechtwinkliges Warnschild mit Katheten 60 cm und 80 cm erhält eine Reflexionsfolie. Berechne A in cm² und die Kosten bei 0,05 € pro cm².',
    costPerUnit: 0.05, costName: 'Folienkosten', costUnit: '€', costType: 'A'
  }
];

const state = { solved: 0, perfect: 0, log: [], nameLocked: false, idx: 0, name: '' };
let task = null, activeInput = null;

const $ = s => document.querySelector(s);
function fmt(x){ return String(Math.round(x * 100) / 100).replace('.', ','); }
function parseNum(s){ if(!s) return NaN; return Number(String(s).trim().replace(',', '.')); }

function openKeypad(inputEl) {
  activeInput = inputEl;
  $('#keypad').hidden = false;
}
function closeKeypad() {
  $('#keypad').hidden = true;
  activeInput = null;
}
function keyPress(key) {
  if (!activeInput) return;
  if (key === 'back') {
    activeInput.value = activeInput.value.slice(0, -1);
  } else {
    if (key === ',' && activeInput.value.includes(',')) return;
    activeInput.value += key;
  }
  activeInput.dispatchEvent(new Event('input'));
}

document.addEventListener('focusin', e => {
  if (e.target.tagName === 'INPUT' && e.target.classList.contains('n')) {
    openKeypad(e.target);
  }
});

function generateCode() {
  let hash = 0;
  const str = state.name + state.solved + state.perfect + state.idx;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash % 900000 + 100000);
}

function updateScore() {
  $('#score').textContent = (state.name ? state.name + ': ' : '') + `Gelöst: ${state.solved} von ${TOTAL_TASKS}, davon fehlerfrei: ${state.perfect}`;
}

function saveToLocalStorage() {
  if (!state.nameLocked) return;
  const data = { name: state.name, solved: state.solved, perfect: state.perfect, idx: state.idx, log: state.log };
  localStorage.setItem('dreieck_text_app_' + state.name.toLowerCase().replace(/\s+/g, ''), JSON.stringify(data));
}

function newTask() {
  const p = PRESETS[state.idx % TOTAL_TASKS];
  
  if (p.type === 'right') {
    task = { ...p, u: p.a+p.b+p.c, A: (p.a*p.b)/2, errors: 0, t0: Date.now() };
  } else {
    task = { ...p, u: p.a+p.b+p.c, A: (p.c*p.h)/2, errors: 0, t0: Date.now() };
  }

  // Kostenberechnung vorbereiten
  let targetVal = 0;
  if (p.costType === 'u') targetVal = task.u;
  else if (p.costType === 'A') {
    targetVal = p.convertToM2 ? task.A / 10000 : task.A;
  } else if (p.costType === 'A_multi') {
    const singleM2 = p.convertToM2 ? task.A / 10000 : task.A;
    targetVal = singleM2 * p.multiplier;
  }
  task.totalCost = targetVal * p.costPerUnit;

  $('#steps').innerHTML = '';
  $('#way').innerHTML = '';
  $('#done').hidden = true;

  const tagText = `${p.section} · Aufgabe ${p.roundNum} von ${p.roundMax} (Gesamt: ${state.idx + 1}/${TOTAL_TASKS}) · ${p.title}`;
  $('#taskText').innerHTML = `<span class="tag">${tagText}</span><br>${p.text}`;

  draw();

  if (!state.nameLocked) {
    task.waiting = true;
    $('#steps').innerHTML = '<div class="step"><p>Gib bitte zuerst oben deinen Namen ein oder nutze einen Speicher-Code.</p></div>';
    return;
  }
  stepFormulaChoice();
}

function draw() {
  const W = 360, H = 220;
  let lines = '', labels = '';

  if (task.type === 'right') {
    const pA = [50, 170], pB = [310, 170], pC = [50, 40];
    lines += `<polygon class="tri" points="${pA.join(',')} ${pB.join(',')} ${pC.join(',')}"/>`;
    lines += `<path class="ra" d="M50,155 L65,155 L65,170"/><circle class="dot" cx="57" cy="162" r="2"/>`;

    lines += `<line x1="${pC[0]}" y1="${pC[1]}" x2="${pA[0]}" y2="${pA[1]}" class="side"/>`;
    lines += `<line x1="${pA[0]}" y1="${pA[1]}" x2="${pB[0]}" y2="${pB[1]}" class="side"/>`;
    lines += `<line x1="${pB[0]}" y1="${pB[1]}" x2="${pC[0]}" y2="${pC[1]}" class="side"/>`;

    labels += `<text x="28" y="110" class="lbl" text-anchor="middle">a=${fmt(task.a)}${task.unit}</text>`;
    labels += `<text x="180" y="195" class="lbl" text-anchor="middle">b=${fmt(task.b)}${task.unit}</text>`;
    labels += `<text x="195" y="95" class="lbl" text-anchor="middle">c=${fmt(task.c)}${task.unit}</text>`;
  } else {
    const scale = 0.18;
    const cPx = Math.min(task.c * scale, 240);
    const xC = 50 + (cPx * 0.55);
    const yC = 170 - Math.min(task.h * scale, 120);

    const pA = [50, 170], pB = [50 + cPx, 170], pC = [xC, yC], pH = [xC, 170];

    lines += `<polygon class="tri" points="${pA.join(',')} ${pB.join(',')} ${pC.join(',')}"/>`;
    lines += `<line x1="${pA[0]}" y1="${pA[1]}" x2="${pC[0]}" y2="${pC[1]}" class="side"/>`;
    lines += `<line x1="${pC[0]}" y1="${pC[1]}" x2="${pB[0]}" y2="${pB[1]}" class="side"/>`;
    lines += `<line x1="${pA[0]}" y1="${pA[1]}" x2="${pB[0]}" y2="${pB[1]}" class="side"/>`;
    lines += `<line x1="${pC[0]}" y1="${pC[1]}" x2="${pH[0]}" y2="${pH[1]}" class="side height-line"/>`;

    labels += `<text x="${(pA[0]+pC[0])/2 - 25}" y="${(pA[1]+pC[1])/2}" class="lbl">b=${fmt(task.b)}</text>`;
    labels += `<text x="${(pC[0]+pB[0])/2 + 10}" y="${(pC[1]+pB[1])/2}" class="lbl">a=${fmt(task.a)}</text>`;
    labels += `<text x="${pA[0] + cPx/2}" y="195" class="lbl" text-anchor="middle">c=${fmt(task.c)}${task.unit}</text>`;
    labels += `<text x="${xC + 10}" y="${(pC[1]+pH[1])/2}" class="lbl">h=${fmt(task.h)}${task.unit}</text>`;
  }

  $('#fig').innerHTML = `<svg viewBox="0 0 ${W} ${H}">${lines}${labels}</svg>`;
}

function addStep(num, title, body) {
  const d = document.createElement('section');
  d.className = 'step';
  d.innerHTML = `<div class="step-head"><span class="num">${num}</span><h3>${title}</h3></div><div class="body">${body}</div><div class="fb"></div>`;
  $('#steps').appendChild(d);
  return d;
}

function wrong(d, msg) {
  task.errors++;
  const fb = d.querySelector('.fb');
  fb.className = 'fb bad';
  fb.textContent = msg;
}

function right(d, msg) {
  d.classList.add('solved');
  const fb = d.querySelector('.fb');
  fb.className = 'fb ok';
  fb.textContent = '✓ ' + msg;
  d.querySelectorAll('input,button,select').forEach(e => e.disabled = true);
  closeKeypad();
}

function addWay(text, cls = '') {
  const el = document.createElement('div');
  el.className = 'wline' + (cls ? ' ' + cls : '');
  el.textContent = text;
  $('#way').appendChild(el);
}

function stepFormulaChoice() {
  const isU = task.costType === 'u';
  const d = addStep(1, 'Welche Formel benötigst du primär?', 
    `<p>Lies den Fragetext genau: Benötigen wir den Umfang u (Zaun/Rand) oder den Flächeninhalt A?</p>
     <div class="opts">
       <button class="opt" data-f="u">Umfang u</button>
       <button class="opt" data-f="A">Flächeninhalt A</button>
     </div>`);

  d.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      const choice = btn.dataset.f;
      if ((isU && choice === 'u') || (!isU && choice === 'A')) {
        btn.classList.add('good');
        right(d, `Richtig! Für ${task.costName} benötigen wir zuerst ${isU ? 'den Umfang u' : 'die Fläche A'}.`);
        if (isU) {
          addWay('u = a + b + c');
          stepCalcU();
        } else {
          const formStr = task.type === 'right' ? 'A = (a · b) / 2' : 'A = (c · h) / 2';
          addWay(formStr);
          stepCalcA();
        }
      } else {
        btn.classList.add('wrongb');
        wrong(d, isU ? 'Ein Zaun oder Rand verläuft UM das Dreieck herum -> Umfang u!' : 'Eine Fläche (Wiese, Dach, Stoff) benötigt den Flächeninhalt A!');
      }
    };
  });
}

function stepCalcU() {
  const d = addStep(2, 'Umfang u berechnen', 
    `<p>Setze die Wände/Kanten ein und berechne u:</p>
     <div class="eq"><span>u =</span><input class="n wide" id="uInp" readonly onclick="openKeypad(this)"><span>${task.unit}</span><button class="check" id="uBtn">Prüfen</button></div>`);

  $('#uBtn').onclick = () => {
    const val = parseNum($('#uInp').value);
    if (Math.abs(val - task.u) < 0.05) {
      right(d, `Korrekt! u = ${fmt(task.u)} ${task.unit}`);
      addWay(`u = ${fmt(task.u)} ${task.unit}`);
      stepCalcCost();
    } else {
      wrong(d, `Addiere die drei Außenseiten (${fmt(task.a)} + ${fmt(task.b)} + ${fmt(task.c)}).`);
    }
  };
}

function stepCalcA() {
  const isRight = task.type === 'right';
  const d = addStep(2, 'Flächeninhalt A berechnen', 
    `<p>Berechne die Fläche A in ${task.unit}²:</p>
     <div class="eq"><span>A =</span><input class="n wide" id="aInp" readonly onclick="openKeypad(this)"><span>${task.unit}²</span><button class="check" id="aBtn">Prüfen</button></div>`);

  $('#aBtn').onclick = () => {
    const val = parseNum($('#aInp').value);
    if (Math.abs(val - task.A) < 0.05) {
      right(d, `Hervorragend! A = ${fmt(task.A)} ${task.unit}²`);
      addWay(`A = ${fmt(task.A)} ${task.unit}²`);
      if (task.convertToM2) {
        stepConvertM2();
      } else if (task.multiplier) {
        stepMultiplier();
      } else {
        stepCalcCost();
      }
    } else {
      wrong(d, isRight ? `Multipliziere Kathete a (${fmt(task.a)}) mit Kathete b (${fmt(task.b)}) und teile durch 2.` : `Multipliziere Grundseite c (${fmt(task.c)}) mit Höhe h (${fmt(task.h)}) und teile durch 2.`);
    }
  };
}

function stepConvertM2() {
  const aM2 = task.A / 10000;
  const d = addStep(3, 'Umrechnung in m²', 
    `<p>Da der Preis pro m² angegeben ist: Rechne A = ${fmt(task.A)} cm² in m² um (durch 10 000 teilen):</p>
     <div class="eq"><span>A =</span><input class="n wide" id="m2Inp" readonly onclick="openKeypad(this)"><span>m²</span><button class="check" id="m2Btn">Prüfen</button></div>`);

  $('#m2Btn').onclick = () => {
    const val = parseNum($('#m2Inp').value);
    if (Math.abs(val - aM2) < 0.005) {
      right(d, `Richtig! A = ${fmt(aM2)} m²`);
      addWay(`A = ${fmt(aM2)} m²`);
      if (task.multiplier) stepMultiplier();
      else stepCalcCost();
    } else {
      wrong(d, `Teile ${fmt(task.A)} durch 10 000 (Komma um 4 Stellen nach links).`);
    }
  };
}

function stepMultiplier() {
  const singleM2 = task.convertToM2 ? task.A / 10000 : task.A;
  const totalM2 = singleM2 * task.multiplier;
  const d = addStep(4, 'Gesamtfläche berechnen', 
    `<p>Das Dach hat ${task.multiplier} gleiche Flächen. Berechne die gesamte Fläche:</p>
     <div class="eq"><span>A_gesamt =</span><input class="n wide" id="multiInp" readonly onclick="openKeypad(this)"><span>m²</span><button class="check" id="multiBtn">Prüfen</button></div>`);

  $('#multiBtn').onclick = () => {
    const val = parseNum($('#multiInp').value);
    if (Math.abs(val - totalM2) < 0.05) {
      right(d, `Sehr gut! Gesamte Fläche = ${fmt(totalM2)} m²`);
      addWay(`A_gesamt = ${fmt(totalM2)} m²`);
      stepCalcCost();
    } else {
      wrong(d, `Multipliziere ${fmt(singleM2)} m² mit ${task.multiplier}.`);
    }
  };
}

function stepCalcCost() {
  const stepNum = $('#steps').children.length + 1;
  const d = addStep(stepNum, 'Kostenberechnung', 
    `<p>Berechne die Gesamtkosten (${fmt(task.costPerUnit)} ${task.costUnit} pro Einheit):</p>
     <div class="eq"><span>Kosten =</span><input class="n wide" id="cInp" readonly onclick="openKeypad(this)"><span>€</span><button class="check" id="cBtn">Prüfen</button></div>`);

  $('#cBtn').onclick = () => {
    const val = parseNum($('#cInp').value);
    if (Math.abs(val - task.totalCost) < 0.1) {
      right(d, `Perfekt! ${task.costName} = ${fmt(task.totalCost)} €`);
      addWay(`Ergebnis: ${fmt(task.totalCost)} €`, 'final');
      finish();
    } else {
      wrong(d, `Multipliziere den ermittelten Wert mit dem Einzelpreis von ${fmt(task.costPerUnit)} €.`);
    }
  };
}

function finish() {
  state.solved++;
  if (task.errors === 0) state.perfect++;
  state.idx++;
  
  state.log.push({
    title: task.title,
    section: task.section,
    res: fmt(task.totalCost) + ' €',
    errors: task.errors,
    time: Math.round((Date.now() - task.t0) / 1000) + 's'
  });

  saveToLocalStorage();
  updateScore();

  const code = generateCode();
  const isFinalEnd = state.idx >= TOTAL_TASKS;

  let btnText = 'Nächste Aufgabe';
  if (state.idx === 6) btnText = 'Hausübung starten (HÜ 1 - 4)';
  else if (isFinalEnd) btnText = 'Zur Gesamtauswertung';

  $('#doneText').innerHTML = (task.errors === 0 
    ? '<b>Perfekt gelöst ohne Fehler!</b>' 
    : `Aufgabe geschafft mit ${task.errors} Fehlversuch(en).`) + 
    `<div class="homework-box">
       <h4>📝 Schulheft-Auftrag</h4>
       <p>Übertrage die Beispielrechnung in dein Heft:</p>
       <ul>
         <li><b>Gegeben & Gesucht:</b> (z.B. c = ..., h = ..., Kosten = ?)</li>
         <li><b>Skizze:</b> Sauber gezeichnet mit Beschriftung</li>
         <li><b>Rechenweg & Antwortsatz:</b> Formel, Einsetzen, Ergebnis</li>
       </ul>
       <hr style="border:0; border-top:1px dashed var(--pen); margin:10px 0;">
       <p style="margin:0; font-size:14px;">Dein aktueller <b>Geräte-Wechsel-Code</b> lautet:</p>
       <div class="codebox">${code}</div>
     </div>`;

  $('#nextBtn').textContent = btnText;
  $('#done').hidden = false;
}

function showSummary() {
  closeKeypad();
  const s = $('#summary');
  let rows = state.log.map((l, i) => 
    `<tr><td>${i+1}</td><td>${l.section}</td><td>${l.title}</td><td>${l.res}</td><td>${l.errors}</td><td>${l.time}</td></tr>`
  ).join('');

  s.innerHTML = `
    <h2>Zusammenfassung für die Lehrkraft</h2>
    <p><b>Name:</b> ${state.name || '–'}</p>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Nr.</th><th>Teil</th><th>Beispiel</th><th>Gesamtkosten</th><th>Fehler</th><th>Zeit</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="homework-box">
      <h4>Wichtiger Hinweis zum Heft-Eintrag:</h4>
      <p>Überprüfe, ob alle 6 Schulübungen und 4 Hausübungen mit <b>Angaben</b>, <b>Skizze</b> und <b>Rechenweg</b> im Heft eingetragen sind!</p>
    </div>
    <br>
    <button class="next" onclick="location.reload()">Neustarten</button>
  `;

  $('.grid').hidden = true;
  $('.controls').hidden = true;
  $('#score').hidden = true;
  s.hidden = false;
}

$('#nameOk').onclick = () => {
  const name = $('#name').value.trim();
  if (!name) { alert('Bitte gib deinen Namen ein.'); return; }
  state.name = name;
  state.nameLocked = true;
  $('#name').disabled = true;
  $('#nameOk').hidden = true;
  
  const saved = localStorage.getItem('dreieck_text_app_' + name.toLowerCase().replace(/\s+/g, ''));
  if (saved) {
    if (confirm('Wir haben einen gespeicherten Stand für "' + name + '" gefunden. Möchtest du dort weitermachen?')) {
      const data = JSON.parse(saved);
      state.solved = data.solved;
      state.perfect = data.perfect;
      state.idx = data.idx;
      state.log = data.log;
    }
  }

  updateScore();
  if (task && task.waiting) {
    task.waiting = false;
    $('#steps').innerHTML = '';
    newTask();
  }
};

$('#codeOk').onclick = () => {
  const codeVal = $('#codeInp').value.trim();
  if (!codeVal) { alert('Bitte gib einen Code ein.'); return; }
  
  let found = false;
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith('dreieck_text_app_')) {
      const data = JSON.parse(localStorage.getItem(key));
      state.name = data.name;
      if (String(generateCode()) === codeVal) {
        state.solved = data.solved;
        state.perfect = data.perfect;
        state.idx = data.idx;
        state.log = data.log;
        state.nameLocked = true;
        $('#name').value = data.name;
        $('#name').disabled = true;
        $('#nameOk').hidden = true;
        found = true;
        break;
      }
    }
  }

  if (found) {
    alert('Fortschritt erfolgreich geladen! Willkommen zurück, ' + state.name + '.');
    updateScore();
    if (task && task.waiting) {
      task.waiting = false;
      $('#steps').innerHTML = '';
      newTask();
    }
  } else {
    alert('Ungültiger Code oder kein passender Speicherstand auf diesem Gerät gefunden.');
  }
};

$('#nextBtn').onclick = () => {
  if (state.idx >= TOTAL_TASKS) showSummary();
  else newTask();
};

newTask();
</script>
</body>
</html>

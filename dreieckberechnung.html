<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berechnungen am Dreieck – Umfang & Flächeninhalt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdfdf9; --grid:#d6e4f2; --ink:#1b2a4a; --pen:#1d4ed8; --muted:#5b6b85;
  --red:#c62828; --red-soft:#fdecea; --green:#2e7d32; --green-soft:#e6f4e7;
  --marker:#ffe36e; --tri:#eaf1fb; --card:#ffffff; --line:#c9d6e6; --btn:#1b2a4a; --btn-ink:#ffffff;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151b26; --grid:#222d3e; --ink:#e6ecf5; --pen:#8fb1ff; --muted:#9aa8bf;
    --red:#ff7a7a; --red-soft:#3a1e22; --green:#6fd17a; --green-soft:#17301c;
    --marker:#7a6516; --tri:#1e2a3e; --card:#1b2231; --line:#33415a; --btn:#e6ecf5; --btn-ink:#151b26;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif; font-size:17px; line-height:1.5;
}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
header h1{font-family:"Patrick Hand",cursive;font-weight:400;font-size:clamp(32px,5vw,48px);line-height:1.05;margin:0 0 6px;color:var(--pen)}
header p{margin:0 0 16px;color:var(--muted);max-width:65ch}
.controls{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px}
.ctl-label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px}
.namein{font:inherit;font-size:16px;padding:7px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);width:260px;max-width:100%}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.sheet{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px}
.task{font-size:19px;margin:0 0 8px}
.task b{font-family:"Patrick Hand",cursive;font-size:26px;color:var(--pen);font-weight:400}
svg{width:100%;height:auto;display:block}
.side{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.side.height-line{stroke:var(--red);stroke-width:2.5;stroke-dasharray:6 4}
.side.selected{stroke:var(--pen);stroke-width:6}
.tri{fill:var(--tri)}
.ra{fill:none;stroke:var(--ink);stroke-width:2}
.dot{fill:var(--ink)}
.lbl{font-family:"Patrick Hand",cursive;font-size:21px;fill:var(--ink)}
.lbl-sub{font-size:14px}
.way-title{margin:16px 0 4px;font-size:15px;color:var(--muted)}
.way{font-family:"Patrick Hand",cursive;font-size:23px;line-height:1.5;color:var(--pen);min-height:44px;border-left:3px solid var(--pen);padding-left:12px}
.way:empty::before{content:"Hier entsteht dein Rechenweg.";color:var(--muted);font-size:18px}
.wline{animation:write .35s ease-out}
@keyframes write{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.wline.final{display:inline-block;border-bottom:3px double var(--pen);margin-top:2px;font-weight:bold}
.steps{display:flex;flex-direction:column;gap:12px}
.step{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.step.solved{border-color:var(--green)}
.step-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:15px}
.step.solved .num{background:var(--green);border-color:var(--green);color:var(--card)}
.step h3{margin:0;font-size:18px}
.step p{margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-family:"Patrick Hand",cursive;font-size:22px;min-width:56px;padding:4px 14px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){background:var(--tri)}
.opt.good{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.opt.wrongb{background:var(--red-soft);border-color:var(--red);color:var(--red);text-decoration:line-through}
.opt:disabled{cursor:default}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:"Patrick Hand",cursive;font-size:24px}
.n{font:inherit;font-family:"Patrick Hand",cursive;font-size:22px;width:75px;padding:2px 6px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--pen);text-align:center}
.n:focus{outline:none;border-color:var(--pen);box-shadow:0 0 0 3px rgba(29,78,216,0.2)}
.n.wide{width:110px}
.check,.next{font:inherit;font-size:16px;font-weight:700;padding:8px 16px;border-radius:10px;border:0;background:var(--btn);color:var(--btn-ink);cursor:pointer}
.fb{font-size:15px;margin-top:8px}
.fb:empty{display:none}
.fb.bad{color:var(--red);background:var(--red-soft);padding:8px 10px;border-radius:8px}
.fb.ok{color:var(--green)}
.hit{stroke:transparent;stroke-width:28;stroke-linecap:round;cursor:pointer;pointer-events:stroke}
.tapnote{text-align:center;font-weight:700;color:var(--pen);margin:6px 0 0;font-size:15px}
.score{font-size:15px;color:var(--muted);margin:0 0 12px;font-weight:bold}
.namerow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.summary{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:20px}
.summary h2{font-family:"Patrick Hand",cursive;font-size:32px;color:var(--pen);margin:0 0 14px}
.tablewrap{overflow-x:auto;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.tag{font-size:14px;color:var(--muted);font-weight:normal}
.homework-box{background:var(--tri);border:2px dashed var(--pen);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:15px}
.homework-box h4{margin:0 0 6px;color:var(--pen);font-size:17px}
.codebox{background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:6px 12px;font-family:monospace;font-size:18px;font-weight:bold;color:var(--pen);display:inline-block;margin:6px 0}
/* Bruchdarstellung */
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;padding:0 4px}
.frac-top{border-bottom:2px solid var(--ink);padding:0 2px;display:flex;align-items:center;gap:4px}
.frac-bot{padding:2px 2px 0;display:flex;justify-content:center}

/* Onscreen Keypad */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:220px;margin-top:10px;padding:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.keypad button{font-family:"Patrick Hand",cursive;font-size:22px;font-weight:bold;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}
.keypad button:active{background:var(--tri)}
.round-banner{background:var(--pen);color:#fff;padding:8px 12px;border-radius:8px;font-weight:bold;margin-bottom:12px;display:inline-block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Dreiecke: Umfang & Flächeninhalt</h1>
    <p>Bestimme Umfang $u$ und Flächeninhalt $A$ in 2 Runden (insgesamt 8 Aufgaben). Wähle die Formeln, setze die Werte ein und berechne das Ergebnis.</p>
  </header>

  <div class="controls">
    <div>
      <label class="ctl-label" for="name">1. Dein Name</label>
      <div class="namerow">
        <input id="name" class="namein" placeholder="Vor- und Nachname">
        <button class="next" id="nameOk">Los geht's</button>
      </div>
    </div>
    <div style="border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px;">
      <label class="ctl-label" for="codeInp">2. Bereits einen Speicher-Code von einem anderen Gerät?</label>
      <div class="namerow">
        <input id="codeInp" class="namein" placeholder="6-stelligen Code eingeben" inputmode="numeric">
        <button class="next" id="codeOk" style="background:var(--muted)">Fortschritt laden</button>
      </div>
    </div>
  </div>

  <div class="score" id="score">Runde 1 · Gelöst: 0 von 8, davon fehlerfrei: 0</div>

  <div class="grid">
    <div class="sheet">
      <p class="task" id="taskText"></p>
      <div id="fig"></div>
      <p class="way-title">Rechenweg</p>
      <div class="way" id="way"></div>
    </div>
    <div>
      <div class="steps" id="steps"></div>

      <!-- Onscreen Keypad -->
      <div id="keypadContainer" style="display:none; margin-top:12px;">
        <span style="font-size:13px; color:var(--muted);">Bildschirm-Tastatur:</span>
        <div class="keypad">
          <button type="button" onclick="kpPress('1')">1</button>
          <button type="button" onclick="kpPress('2')">2</button>
          <button type="button" onclick="kpPress('3')">3</button>
          <button type="button" onclick="kpPress('4')">4</button>
          <button type="button" onclick="kpPress('5')">5</button>
          <button type="button" onclick="kpPress('6')">6</button>
          <button type="button" onclick="kpPress('7')">7</button>
          <button type="button" onclick="kpPress('8')">8</button>
          <button type="button" onclick="kpPress('9')">9</button>
          <button type="button" onclick="kpPress(',')">,</button>
          <button type="button" onclick="kpPress('0')">0</button>
          <button type="button" onclick="kpDel()">⌫</button>
        </div>
      </div>

      <div class="done" id="done" hidden style="margin-top:16px;">
        <p id="doneText" style="font-size:18px; margin-bottom:12px;"></p>
        <button class="next" id="nextBtn">Nächste Aufgabe</button>
      </div>
    </div>
  </div>

  <section class="summary" id="summary" hidden></section>
</div>

<script>
const TOTAL_TASKS = 8;
const TASKS_PER_ROUND = 4;

// 8 Festgelegte Aufgaben (Runde 1: 1-4, Runde 2: 5-8)
const TASK_DEFINITIONS = [
  // Runde 1
  { round: 1, nr: 1, type: 'right', a: 6, b: 14, c: 15.23 },
  { round: 1, nr: 2, type: 'general', heightSide: 'c', a: 11, b: 16, c: 20, h: 8 },
  { round: 1, nr: 3, type: 'right', a: 8, b: 18, c: 19.70 },
  { round: 1, nr: 4, type: 'general', heightSide: 'c', a: 13, b: 19, c: 24, h: 10 },
  // Runde 2
  { round: 2, nr: 5, type: 'right', a: 7, b: 15, c: 16.55 },
  { round: 2, nr: 6, type: 'general', heightSide: 'c', a: 14, b: 22, c: 28, h: 11 },
  { round: 2, nr: 7, type: 'right', a: 9, b: 12, c: 15 },
  { round: 2, nr: 8, type: 'general', heightSide: 'c', a: 15, b: 20, c: 25, h: 12 }
];

const state = { solved: 0, perfect: 0, log: [], nameLocked: false, idx: 0, name: '', activeInput: null };
let task = null;

const $ = s => document.querySelector(s);
function fmt(x){ return String(Math.round(x * 100) / 100).replace('.', ','); }
function parseNum(s){ return Number(String(s).trim().replace(',', '.')); }

// Keypad-Funktionen
function activeField(el) { state.activeInput = el; $('#keypadContainer').style.display = 'block'; }
function kpPress(val) {
  if (state.activeInput) {
    state.activeInput.value += val;
    state.activeInput.focus();
  }
}
function kpDel() {
  if (state.activeInput) {
    state.activeInput.value = state.activeInput.value.slice(0, -1);
    state.activeInput.focus();
  }
}

function generateCode() {
  let hash = 0;
  const str = (state.name || "SCHUELER") + "_" + state.solved + "_" + state.perfect + "_" + state.idx;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash % 900000 + 100000);
}

function updateScore() {
  const curRound = state.idx < 4 ? 1 : 2;
  $('#score').textContent = (state.name ? state.name + ' · ' : '') + `Runde ${curRound} · Gelöst: ${state.solved} von ${TOTAL_TASKS}, davon fehlerfrei: ${state.perfect}`;
}

function saveToLocalStorage() {
  if (!state.nameLocked) return;
  const data = {
    name: state.name,
    solved: state.solved,
    perfect: state.perfect,
    idx: state.idx,
    log: state.log,
    code: generateCode()
  };
  localStorage.setItem('dreieck_app_' + state.name.toLowerCase().replace(/\s+/g, ''), JSON.stringify(data));
  localStorage.setItem('dreieck_code_' + data.code, JSON.stringify(data));
}

function newTask() {
  if (state.idx >= TOTAL_TASKS) {
    showSummary();
    return;
  }

  const def = TASK_DEFINITIONS[state.idx];
  
  if (def.type === 'right') {
    const cVal = def.c || Math.sqrt(def.a * def.a + def.b * def.b);
    task = { 
      nr: def.nr, round: def.round, type: 'right', 
      a: def.a, b: def.b, c: Math.round(cVal * 100) / 100, 
      u: Math.round((def.a + def.b + cVal) * 100) / 100, 
      A: Math.round(((def.a * def.b) / 2) * 100) / 100, 
      selected: new Set(), errors: 0, t0: Date.now() 
    };
  } else {
    task = { 
      nr: def.nr, round: def.round, type: 'general', heightSide: 'c', 
      a: def.a, b: def.b, c: def.c, h: def.h, 
      u: def.a + def.b + def.c, 
      A: (def.c * def.h) / 2, 
      selected: new Set(), errors: 0, t0: Date.now() 
    };
  }

  $('#steps').innerHTML = '';
  $('#way').innerHTML = '';
  $('#done').hidden = true;
  $('#keypadContainer').style.display = 'none';

  const figName = task.type === 'right' ? 'Rechtwinkliges Dreieck' : 'Allgemeines Dreieck';
  $('#taskText').innerHTML = `<span class="round-banner">Runde ${task.round}</span> <span class="tag">Aufgabe ${task.nr} von ${TOTAL_TASKS} · ${figName}</span><br>Bestimme Umfang <b>u</b> und Flächeninhalt <b>A</b>.`;

  draw();

  if (!state.nameLocked) {
    task.waiting = true;
    $('#steps').innerHTML = '<div class="step"><p>Gib bitte zuerst oben deinen Namen ein oder verwende deinen Speicher-Code, um fortzufahren.</p></div>';
    return;
  }
  stepSelectSides();
}

function draw() {
  const W = 360, H = 220;
  let lines = '', hits = '', labels = '';

  if (task.type === 'right') {
    const pA = [60, 180], pB = [280, 180], pC = [60, 50];
    const segs = {
      'a': [pC, pA, `a = ${fmt(task.a)} cm`, [32, 115]],
      'b': [pA, pB, `b = ${fmt(task.b)} cm`, [170, 202]],
      'c': [pC, pB, `c = ${fmt(task.c)} cm`, [180, 105]]
    };

    let pathD = `M ${pA[0]} ${pA[1]} L ${pB[0]} ${pB[1]} L ${pC[0]} ${pC[1]} Z`;
    lines += `<path d="${pathD}" class="tri"/>`;

    // Rechter Winkel
    lines += `<path d="M 60 165 L 75 165 L 75 180" class="ra"/><circle cx="67" cy="173" r="2" class="dot"/>`;

    for (let id in segs) {
      const [p1, p2, txt, pos] = segs[id];
      const sel = task.selected.has(id) ? ' selected' : '';
      lines += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" class="side${sel}" id="s_${id}"/>`;
      hits += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" class="hit" onclick="toggleSide('${id}')"/>`;
      labels += `<text x="${pos[0]}" y="${pos[1]}" class="lbl" text-anchor="middle">${txt}</text>`;
    }

  } else {
    // Allgemeines Dreieck mit Höhe h_c
    const pA = [50, 180], pB = [290, 180], pC = [160, 50], pH = [160, 180];
    const segs = {
      'a': [pC, pB, `a = ${fmt(task.a)} cm`, [240, 110]],
      'b': [pA, pC, `b = ${fmt(task.b)} cm`, [90, 110]],
      'c': [pA, pB, `c = ${fmt(task.c)} cm`, [170, 202]]
    };

    let pathD = `M ${pA[0]} ${pA[1]} L ${pB[0]} ${pB[1]} L ${pC[0]} ${pC[1]} Z`;
    lines += `<path d="${pathD}" class="tri"/>`;

    // Höhe h_c
    lines += `<line x1="${pH[0]}" y1="${pH[1]}" x2="${pC[0]}" y2="${pC[1]}" class="side height-line"/>`;
    lines += `<path d="M 160 168 L 172 168 L 172 180" class="ra"/><circle cx="166" cy="174" r="2" class="dot"/>`;
    labels += `<text x="180" y="125" class="lbl" fill="var(--red)">h<tspan font-size="14" dy="3">c</tspan><tspan font-size="21" dy="-3"> = ${fmt(task.h)} cm</tspan></text>`;

    for (let id in segs) {
      const [p1, p2, txt, pos] = segs[id];
      const sel = task.selected.has(id) ? ' selected' : '';
      lines += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" class="side${sel}" id="s_${id}"/>`;
      hits += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" class="hit" onclick="toggleSide('${id}')"/>`;
      labels += `<text x="${pos[0]}" y="${pos[1]}" class="lbl" text-anchor="middle">${txt}</text>`;
    }
  }

  $('#fig').innerHTML = `<svg viewBox="0 0 ${W} ${H}">${lines}${hits}${labels}</svg>`;
}

function toggleSide(id) {
  if (!$('#sideBtn')) return;
  if (task.selected.has(id)) task.selected.delete(id);
  else task.selected.add(id);
  draw();
}

function addStep(num, title, html) {
  const d = document.createElement('div');
  d.className = 'step';
  d.innerHTML = `<div class="step-head"><div class="num">${num}</div><h3>${title}</h3></div><div>${html}</div><div class="fb"></div>`;
  $('#steps').appendChild(d);
  d.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  return d;
}

function right(stepEl, msg) {
  stepEl.classList.add('solved');
  const fb = stepEl.querySelector('.fb');
  fb.className = 'fb ok';
  fb.textContent = msg;
  stepEl.querySelectorAll('input, button').forEach(e => e.disabled = true);
  $('#keypadContainer').style.display = 'none';
}

function wrong(stepEl, msg) {
  task.errors++;
  const fb = stepEl.querySelector('.fb');
  fb.className = 'fb bad';
  fb.textContent = msg;
}

function addWay(line, extraClass = '') {
  const w = $('#way');
  const div = document.createElement('div');
  div.className = 'wline' + (extraClass ? ' ' + extraClass : '');
  div.innerHTML = line;
  w.appendChild(div);
}

// Schritt 1: 3 Umfangsseiten anklicken
function stepSelectSides() {
  const d = addStep(1, 'Umfangsseiten in der Skizze wählen', 
    `<p>Klicke in der Skizze die <b>3 Außenseiten</b> an, die zusammen den Umfang $u$ bilden.</p>
     <p class="tapnote">Tippe auf die Linien in der Skizze!</p>
     <button class="check" id="sideBtn" style="margin-top:8px">Auswahl prüfen</button>`);

  $('#sideBtn').onclick = () => {
    if (task.selected.has('a') && task.selected.has('b') && task.selected.has('c') && task.selected.size === 3) {
      right(d, 'Ausgezeichnet! Umfang = alle 3 Außenseiten.');
      stepFormulaU();
    } else {
      wrong(d, 'Für den Umfang brauchst du genau die 3 äußeren Seiten a, b und c!');
    }
  };
}

// Schritt 2: Formel für Umfang u wählen
function stepFormulaU() {
  const d = addStep(2, 'Formel für den Umfang u wählen', 
    `<p>Welche Formel beschreibt den Umfang des Dreiecks?</p>
     <div class="opts">
       <button class="opt" data-f="1">u = a + b + c</button>
       <button class="opt" data-f="2">u = a · b · c</button>
       <button class="opt" data-f="3">u = (a · b) / 2</button>
     </div>`);

  d.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      if (btn.dataset.f === '1') {
        btn.classList.add('good');
        right(d, 'Richtig! u = a + b + c');
        addWay('u = a + b + c');
        stepInsertU();
      } else {
        btn.classList.add('wrongb');
        wrong(d, 'Der Umfang ist die Summe aller drei Außenseiten (+).');
      }
    };
  });
}

// Schritt 3: Zahlen in Umfang-Formel einsetzen
function stepInsertU() {
  const d = addStep(3, 'Zahlen in die Umfang-Formel einsetzen', 
    `<p>Lies die 3 Seitenlängen aus der Skizze ab und trage sie ein:</p>
     <div class="eq">
       <span>u =</span>
       <input class="n" id="uA" onfocus="activeField(this)"><span>+</span>
       <input class="n" id="uB" onfocus="activeField(this)"><span>+</span>
       <input class="n" id="uC" onfocus="activeField(this)">
       <button class="check" id="uInsBtn">Prüfen</button>
     </div>`);

  $('#uInsBtn').onclick = () => {
    const vA = parseNum($('#uA').value);
    const vB = parseNum($('#uB').value);
    const vC = parseNum($('#uC').value);
    
    const vals = [vA, vB, vC].sort((x,y)=>x-y);
    const expected = [task.a, task.b, task.c].sort((x,y)=>x-y);

    if (Math.abs(vals[0] - expected[0]) < 0.05 && Math.abs(vals[1] - expected[1]) < 0.05 && Math.abs(vals[2] - expected[2]) < 0.05) {
      right(d, 'Richtig eingesetzt!');
      addWay(`u = ${fmt(task.a)} + ${fmt(task.b)} + ${fmt(task.c)}`);
      stepCalcU();
    } else {
      wrong(d, `Schau genau auf die Skizze. Die Seiten sind: ${fmt(task.a)}, ${fmt(task.b)} und ${fmt(task.c)}.`);
    }
  };
}

// Schritt 4: Umfang berechnen
function stepCalcU() {
  const d = addStep(4, 'Umfang u berechnen', 
    `<p>Berechne das Gesamtergebnis:</p>
     <div class="eq"><span>u =</span><input class="n wide" id="uInp" onfocus="activeField(this)"><span>cm</span><button class="check" id="uBtn">Prüfen</button></div>`);

  $('#uBtn').onclick = () => {
    const val = parseNum($('#uInp').value);
    if (Math.abs(val - task.u) < 0.05) {
      right(d, `Korrekt! u = ${fmt(task.u)} cm`);
      addWay(`u = ${fmt(task.u)} cm`);
      stepFormulaA();
    } else {
      wrong(d, `Addiere die drei Zahlen: ${fmt(task.a)} + ${fmt(task.b)} + ${fmt(task.c)}`);
    }
  };
}

// Schritt 5: Formel für Flächeninhalt A wählen
function stepFormulaA() {
  let opt1, opt2, opt3, correctFormula;
  if (task.type === 'right') {
    correctFormula = 'A = (a · b) / 2';
    opt1 = 'A = (a · b) / 2';
    opt2 = 'A = (a · c) / 2';
    opt3 = 'A = a + b + c';
  } else {
    correctFormula = 'A = (c · h_c) / 2';
    opt1 = 'A = (a · b) / 2';
    opt2 = 'A = (c · h_c) / 2';
    opt3 = 'A = a + b + c';
  }

  const d = addStep(5, 'Formel für Flächeninhalt A wählen', 
    `<p>Welche Formel passt zu den Angaben in unserer Skizze?</p>
     <div class="opts">
       <button class="opt" data-f="${opt1}">${opt1.replace('h_c', 'h<sub>c</sub>')}</button>
       <button class="opt" data-f="${opt2}">${opt2.replace('h_c', 'h<sub>c</sub>')}</button>
       <button class="opt" data-f="${opt3}">${opt3}</button>
     </div>`);

  d.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      if (btn.dataset.f === correctFormula) {
        btn.classList.add('good');
        right(d, `Richtig! Formel: ${correctFormula.replace('h_c', 'h_c')}`);
        addWay(correctFormula.replace('h_c', 'h<sub>c</sub>'));
        stepInsertA();
      } else {
        btn.classList.add('wrongb');
        wrong(d, task.type === 'right' ? 'Im rechtwinkligen Dreieck lautet die Formel A = (a · b) / 2.' : 'Beim allgemeinen Dreieck nutzt du Grundseite c und die Höhe h_c!');
      }
    };
  });
}

// Schritt 6: Zahlen in Flächen-Formel einsetzen
function stepInsertA() {
  const d = addStep(6, 'Zahlen in die Bruch-Formel einsetzen', 
    `<p>Setze die passenden Werte aus der Skizze in den Bruch ein:</p>
     <div class="eq">
       <span>A =</span>
       <div class="frac">
         <div class="frac-top">
           <input class="n" id="aTop1" onfocus="activeField(this)"><span>·</span><input class="n" id="aTop2" onfocus="activeField(this)">
         </div>
         <div class="frac-bot">
           <input class="n" id="aBot" value="2" style="width:45px" onfocus="activeField(this)">
         </div>
       </div>
       <button class="check" id="aInsBtn">Prüfen</button>
     </div>`);

  $('#aInsBtn').onclick = () => {
    const t1 = parseNum($('#aTop1').value);
    const t2 = parseNum($('#aTop2').value);
    const bot = parseNum($('#aBot').value);

    const exp1 = task.type === 'right' ? task.a : task.c;
    const exp2 = task.type === 'right' ? task.b : task.h;

    const topOk = (Math.abs(t1 - exp1) < 0.05 && Math.abs(t2 - exp2) < 0.05) || (Math.abs(t1 - exp2) < 0.05 && Math.abs(t2 - exp1) < 0.05);
    const botOk = bot === 2;

    if (topOk && botOk) {
      right(d, 'Super eingesetzt!');
      addWay(`A = (${fmt(exp1)} · ${fmt(exp2)}) / 2`);
      stepCalcA();
    } else {
      if (!botOk) {
        wrong(d, 'Der Nenner beim Dreieck ist immer 2!');
      } else {
        wrong(d, task.type === 'right' 
          ? `Nutze die beiden Katheten a (${fmt(task.a)}) und b (${fmt(task.b)}).` 
          : `Nutze die Grundseite c (${fmt(task.c)}) und die Höhe h_c (${fmt(task.h)}).`);
      }
    }
  };
}

// Schritt 7: Flächeninhalt A berechnen
function stepCalcA() {
  let numText, val1, val2;
  if (task.type === 'right') {
    val1 = task.a; val2 = task.b;
  } else {
    val1 = task.c; val2 = task.h;
  }
  numText = `${fmt(val1)} · ${fmt(val2)}`;

  const d = addStep(7, 'Flächeninhalt A berechnen', 
    `<p>Berechne: Zuerst Zähler mulitplizieren (${numText}), dann durch 2 teilen.</p>
     <div class="eq"><span>A =</span><input class="n wide" id="aInp" onfocus="activeField(this)"><span>cm²</span><button class="check" id="aBtn">Prüfen</button></div>`);

  $('#aBtn').onclick = () => {
    const val = parseNum($('#aInp').value);
    if (Math.abs(val - task.A) < 0.05) {
      right(d, `Hervorragend! A = ${fmt(task.A)} cm²`);
      addWay(`A = (${numText}) / 2 = ${fmt(task.A)} cm²`, 'final');
      finish();
    } else {
      wrong(d, `Berechne (${numText}) ÷ 2.`);
    }
  };
}

function finish() {
  state.solved++;
  if (task.errors === 0) state.perfect++;
  state.idx++;
  
  state.log.push({
    round: task.round,
    nr: task.nr,
    type: task.type === 'right' ? 'Rechtw. Dreieck' : 'Allg. Dreieck',
    u: fmt(task.u) + ' cm',
    A: fmt(task.A) + ' cm²',
    errors: task.errors,
    time: Math.round((Date.now() - task.t0) / 1000) + 's'
  });

  saveToLocalStorage();
  updateScore();

  const code = generateCode();
  
  if (state.idx === TASKS_PER_ROUND) {
    // Ende von Runde 1
    $('#doneText').innerHTML = `
      <b>🎉 Runde 1 geschafft!</b><br>
      Du hast 4 von 4 Aufgaben gelöst. Bereit für Runde 2 mit neuen Herausforderungen?
      <div class="homework-box">
        <h4>📝 Schulheft-Auftrag</h4>
        <p>Übertrage Aufgabe ${task.nr} sauber in dein Heft:</p>
        <ul>
          <li><b>Links:</b> Angaben (Gegeben & Gesucht)</li>
          <li><b>Mitte:</b> Skizze mit Beschriftung</li>
          <li><b>Rechts:</b> Formeln & Rechenweg</li>
        </ul>
        <hr style="border:0; border-top:1px dashed var(--pen); margin:8px 0;">
        <p style="margin:0; font-size:14px;">Geräte-Wechsel-Code: <b>${code}</b></p>
      </div>`;
    $('#nextBtn').textContent = 'Runde 2 starten 🚀';
  } else if (state.idx >= TOTAL_TASKS) {
    // Ende von Runde 2
    $('#doneText').innerHTML = `
      <b>🏆 Alle 2 Runden erfolgreich absolviert!</b><br>
      Großartige Leistung! Alle 8 Aufgaben wurden gelöst.
      <div class="homework-box">
        <h4>📝 Schulheft-Auftrag</h4>
        <p>Kontrolliere deine Eintrags-Seiten im Heft auf Vollständigkeit.</p>
        <div class="codebox">Speicher-Code: ${code}</div>
      </div>`;
    $('#nextBtn').textContent = 'Zur Gesamt-Zusammenfassung';
  } else {
    // Normale Aufgabe gelöst
    $('#doneText').innerHTML = (task.errors === 0 
      ? '<b>Perfekt gelöst ohne Fehler!</b>' 
      : `Aufgabe geschafft mit ${task.errors} Fehlversuch(en).`) + 
      `<div class="homework-box">
         <h4>📝 Schulheft-Auftrag</h4>
         <p>Übertrage die Aufgabe sauber in dein Heft:</p>
         <ul>
           <li><b>Ganz links:</b> Die Angaben (Gegeben & Gesucht)</li>
           <li><b>In der Mitte:</b> Die saubere Skizze mit Beschriftung</li>
           <li><b>Ganz rechts:</b> Die Rechenschritte und Formeln</li>
         </ul>
         <hr style="border:0; border-top:1px dashed var(--pen); margin:10px 0;">
         <p style="margin:0; font-size:14px;">Dein aktueller <b>Geräte-Wechsel-Code</b> lautet:</p>
         <div class="codebox">${code}</div>
       </div>`;
    $('#nextBtn').textContent = 'Nächste Aufgabe';
  }

  $('#done').hidden = false;
}

function showSummary() {
  const s = $('#summary');
  let rows = state.log.map((l) => 
    `<tr><td>${l.nr} (Runde ${l.round})</td><td>${l.type}</td><td>${l.u}</td><td>${l.A}</td><td>${l.errors}</td><td>${l.time}</td></tr>`
  ).join('');

  s.innerHTML = `
    <h2>Gesamt-Zusammenfassung für die Lehrkraft</h2>
    <p><b>Schüler/in:</b> ${state.name || '–'}</p>
    <p><b>Ergebnis:</b> ${state.solved} von ${TOTAL_TASKS} Aufgaben gelöst (${state.perfect} fehlerfrei)</p>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Aufgabe</th><th>Typ</th><th>Umfang u</th><th>Fläche A</th><th>Fehler</th><th>Zeit</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="homework-box">
      <h4>Wichtiger Hinweis zum Heft-Eintrag:</h4>
      <p>Überprüfe, ob alle 8 Aufgaben vollständig mit <b>Angaben (links)</b>, <b>Skizze (Mitte)</b> und <b>Rechenschritten (rechts)</b> im Heft stehen!</p>
    </div>
    <br>
    <button class="next" onclick="location.reload()">Neustarten</button>
  `;

  $('.grid').hidden = true;
  $('.controls').hidden = true;
  $('#score').hidden = true;
  s.hidden = false;
}

$('#nameOk').onclick = () => {
  const name = $('#name').value.trim();
  if (!name) { alert('Bitte gib deinen Namen ein.'); return; }
  state.name = name;
  state.nameLocked = true;
  $('#name').disabled = true;
  $('#nameOk').hidden = true;
  
  const saved = localStorage.getItem('dreieck_app_' + name.toLowerCase().replace(/\s+/g, ''));
  if (saved) {
    if (confirm('Ein gespeicherter Fortschritt für "' + name + '" wurde gefunden. Möchtest du an dieser Stelle weitermachen?')) {
      const data = JSON.parse(saved);
      state.solved = data.solved;
      state.perfect = data.perfect;
      state.idx = data.idx;
      state.log = data.log;
    }
  }

  updateScore();
  if (task && task.waiting) {
    task.waiting = false;
    $('#steps').innerHTML = '';
    newTask();
  }
};

$('#codeOk').onclick = () => {
  const codeVal = $('#codeInp').value.trim();
  if (!codeVal) { alert('Bitte gib deinen 6-stelligen Code ein.'); return; }
  
  const savedByCode = localStorage.getItem('dreieck_code_' + codeVal);
  if (savedByCode) {
    const data = JSON.parse(savedByCode);
    state.name = data.name;
    state.solved = data.solved;
    state.perfect = data.perfect;
    state.idx = data.idx;
    state.log = data.log;
    state.nameLocked = true;
    
    $('#name').value = data.name;
    $('#name').disabled = true;
    $('#nameOk').hidden = true;

    alert('Fortschritt erfolgreich geladen! Willkommen zurück, ' + state.name + '.');
    updateScore();
    if (task && task.waiting) {
      task.waiting = false;
      $('#steps').innerHTML = '';
      newTask();
    }
  } else {
    alert('Der eingegebene Code konnte nicht gefunden werden.');
  }
};

$('#nextBtn').onclick = () => {
  if (state.idx >= TOTAL_TASKS) showSummary();
  else newTask();
};

newTask();
</script>
</body>
</html>

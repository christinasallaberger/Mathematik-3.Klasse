<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Textaufgaben: Dreiecke & Sachrechnen – Umfang & Flächeninhalt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdfdf9; --grid:#d6e4f2; --ink:#1b2a4a; --pen:#1d4ed8; --muted:#5b6b85;
  --red:#c62828; --red-soft:#fdecea; --green:#2e7d32; --green-soft:#e6f4e7;
  --marker:#ffe36e; --tri:#eaf1fb; --card:#ffffff; --line:#c9d6e6; --btn:#1b2a4a; --btn-ink:#ffffff;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151b26; --grid:#222d3e; --ink:#e6ecf5; --pen:#8fb1ff; --muted:#9aa8bf;
    --red:#ff7a7a; --red-soft:#3a1e22; --green:#6fd17a; --green-soft:#17301c;
    --marker:#7a6516; --tri:#1e2a3e; --card:#1b2231; --line:#33415a; --btn:#e6ecf5; --btn-ink:#151b26;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif; font-size:17px; line-height:1.5;
  padding-bottom:280px;
}
.wrap{max-width:1080px;margin:0 auto;padding:24px 18px 60px}
header h1{font-family:"Patrick Hand",cursive;font-weight:400;font-size:clamp(32px,5.5vw,46px);line-height:1.05;margin:0 0 6px;color:var(--pen)}
header p{margin:0 0 16px;color:var(--muted);max-width:65ch}

/* Kompakte Aufgaben-Leiste oben */
.taskbar{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:20px;display:flex;flex-direction:column;gap:8px}
.taskbar-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.taskbar-label{font-size:13px;font-weight:700;color:var(--muted);width:95px;flex:none}
.tbadge{font-family:"Patrick Hand",cursive;font-size:18px;width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:all 0.2s}
.tbadge:hover{border-color:var(--pen);background:var(--tri)}
.tbadge.active{background:var(--pen);color:#fff;border-color:var(--pen)}
.tbadge.solved-badge{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.tbadge.solved-badge.active{background:var(--green);color:#fff}

.controls{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px}
.ctl-label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px}
.namein{font:inherit;font-size:16px;padding:7px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);width:260px;max-width:100%}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.sheet{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px}
.task{font-size:19px;margin:0 0 12px;line-height:1.4}
.task b{font-family:"Patrick Hand",cursive;font-size:24px;color:var(--pen);font-weight:400}
svg{width:100%;height:auto;display:block}
.side{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.side.height-line{stroke:var(--red);stroke-width:2.5;stroke-dasharray:6 4}
.side.selected{stroke:var(--pen);stroke-width:5}
.tri{fill:var(--tri)}
.ra{fill:none;stroke:var(--ink);stroke-width:2}
.dot{fill:var(--ink)}
.lbl{font-family:"Patrick Hand",cursive;font-size:18px;fill:var(--ink)}
.hit{stroke:transparent;stroke-width:32;stroke-linecap:round;cursor:pointer;pointer-events:stroke}
.tapnote{text-anchor:middle;font-weight:700;fill:var(--pen);font-size:15px}

.way-title{margin:18px 0 4px;font-size:15px;color:var(--muted)}
.way{font-family:"Patrick Hand",cursive;font-size:23px;line-height:1.5;color:var(--pen);min-height:44px;border-left:3px solid var(--pen);padding-left:14px}
.way:empty::before{content:"Hier entsteht dein Rechenweg.";color:var(--muted);font-size:18px}
.wline{animation:write .35s ease-out}
@keyframes write{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.wline.final{display:inline-block;border-bottom:3px double var(--pen);margin-top:2px;font-weight:bold}

.steps{display:flex;flex-direction:column;gap:12px}
.step{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.step.solved{border-color:var(--green)}
.step-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:15px}
.step.solved .num{background:var(--green);border-color:var(--green);color:var(--card)}
.step h3{margin:0;font-size:18px}
.step p{margin:0 0 8px}

.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-family:"Patrick Hand",cursive;font-size:21px;min-width:56px;padding:4px 14px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){background:var(--tri)}
.opt.good{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.opt.wrongb{background:var(--red-soft);border-color:var(--red);color:var(--red);text-decoration:line-through}
.opt:disabled{cursor:default}

.eq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:"Patrick Hand",cursive;font-size:23px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px}
.frac-top{border-bottom:2px solid var(--ink);padding-bottom:2px;display:flex;align-items:center;gap:4px}
.frac-bot{padding-top:2px;display:flex;align-items:center;justify-content:center}
.n{font:inherit;font-family:"Patrick Hand",cursive;font-size:21px;width:75px;padding:2px 4px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--pen);text-align:center}
.n:focus{outline:3px solid var(--pen)}
.n.wide{width:110px}
.check,.next{font:inherit;font-size:16px;font-weight:700;padding:8px 16px;border-radius:10px;border:0;background:var(--btn);color:var(--btn-ink);cursor:pointer}
.fb{font-size:15px;margin-top:8px}
.fb:empty{display:none}
.fb.bad{color:var(--red);background:var(--red-soft);padding:8px 10px;border-radius:8px}
.fb.ok{color:var(--green)}
.score{font-size:15px;color:var(--muted);margin:0 0 12px}
.namerow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.summary{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:20px}
.summary h2{font-family:"Patrick Hand",cursive;font-size:32px;color:var(--pen);margin:0 0 14px}
.tablewrap{overflow-x:auto;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.tag{font-size:14px;color:var(--muted);font-weight:bold}
.homework-box{background:var(--tri);border:2px dashed var(--pen);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:15px}
.homework-box h4{margin:0 0 6px;color:var(--pen);font-size:17px}
.codebox{background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:8px 12px;font-family:monospace;font-size:18px;font-weight:bold;color:var(--pen);display:inline-block;margin:6px 0}

.keypad{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:3px solid var(--pen);padding:10px 14px;box-shadow:0 -4px 20px rgba(0,0,0,0.15);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:999}
.keypad-header{display:flex;justify-content:space-between;width:100%;max-width:380px;font-size:14px;font-weight:bold;color:var(--muted)}
.keypad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:380px}
.keybtn{font-family:"Patrick Hand",cursive;font-size:24px;padding:8px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer;text-align:center}
.keybtn:active{background:var(--tri)}
.keybtn.action{background:var(--btn);color:var(--btn-ink);font-size:18px;font-family:sans-serif}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Textaufgaben: Dreiecke & Sachrechnen</h1>
    <p>Berechne Umfang, Flächeninhalt und Folgekosten bei Alltagsaufgaben. (6 Schulübungen & 4 Hausübungen)</p>
  </header>

  <!-- Aufgaben-Leiste oben -->
  <div class="taskbar">
    <div class="taskbar-row">
      <span class="taskbar-label">Schulübung:</span>
      <div id="badgesSUE" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
    </div>
    <div class="taskbar-row" style="border-top:1px solid var(--line); padding-top:6px;">
      <span class="taskbar-label">Hausübung:</span>
      <div id="badgesHUE" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
    </div>
  </div>

  <div class="controls">
    <div>
      <label class="ctl-label" for="name">1. Dein Name</label>
      <div class="namerow">
        <input id="name" class="namein" placeholder="Vor- und Nachname">
        <button class="next" id="nameOk">Starten</button>
      </div>
    </div>
    <div style="border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px;">
      <label class="ctl-label" for="codeInp">2. Bereits einen Speicher-Code von einem anderen Gerät?</label>
      <div class="namerow">
        <input id="codeInp" class="namein" placeholder="Zahlencode eingeben" inputmode="numeric">
        <button class="next" id="codeOk" style="background:var(--muted)">Fortschritt laden</button>
      </div>
    </div>
  </div>

  <p class="score" id="score">Gelöst: 0 von 10, davon fehlerfrei: 0</p>

  <div class="grid">
    <div class="sheet">
      <p class="task" id="taskText"></p>
      <div id="fig"></div>
      <p class="way-title">Rechenweg</p>
      <div class="way" id="way"></div>
    </div>
    <div>
      <div class="steps" id="steps"></div>
      <div class="done" id="done" hidden style="margin-top:16px;">
        <p id="doneText" style="font-size:18px; margin-bottom:12px;"></p>
        <button class="next" id="nextBtn">Nächste Aufgabe</button>
      </div>
    </div>
  </div>

  <section class="summary" id="summary" hidden></section>
</div>

<!-- Virtuelle Zusatztastatur -->
<div class="keypad" id="keypad" hidden>
  <div class="keypad-header">
    <span>Bildschirm-Tastatur (Tippen oder physisch nutzen)</span>
    <span style="cursor:pointer; color:var(--red)" onclick="closeKeypad()">✕ Schließen</span>
  </div>
  <div class="keypad-grid">
    <button class="keybtn" onclick="keyPress('7')">7</button>
    <button class="keybtn" onclick="keyPress('8')">8</button>
    <button class="keybtn" onclick="keyPress('9')">9</button>
    <button class="keybtn" onclick="keyPress('4')">4</button>
    <button class="keybtn" onclick="keyPress('5')">5</button>
    <button class="keybtn" onclick="keyPress('6')">6</button>
    <button class="keybtn" onclick="keyPress('1')">1</button>
    <button class="keybtn" onclick="keyPress('2')">2</button>
    <button class="keybtn" onclick="keyPress('3')">3</button>
    <button class="keybtn" onclick="keyPress(',')">,</button>
    <button class="keybtn" onclick="keyPress('0')">0</button>
    <button class="keybtn action" onclick="keyPress('back')">⌫</button>
  </div>
</div>

<script>
const TOTAL_TASKS = 10;
const PRESETS = [
  // --- SCHULÜBUNG (6 Aufgaben) ---
  { 
    section: 'Schulübung', num: 1, type: 'general', a: 900, b: 1400, c: 1600, h: 800, unit: 'm',
    title: 'Waldstück aufforsten', 
    text: 'Ein dreieckiges Waldstück soll mit Fichten neu aufgeforstet werden. Wie groß ist die Fläche A in m² und wie teuer ist das Holz, wenn 1 m² Fichtenpflanzen 2,50 € kosten?',
    costPerUnit: 2.50, costName: 'Gesamtkosten', costUnit: '€', costType: 'A'
  },

    costPerUnit: 38, costName: 'Holzkosten', costUnit: '€', costType: 'A', convertToM2: true
  },

  },

    costPerUnit: 15, costName: 'Einfassungskosten', costUnit: '€', costType: 'u'
  },
  {

  },

  // --- HAUSÜBUNG (4 Aufgaben) ---
  { 
    section: 'Hausübung', num: 1, type: 'general', a: 24, b: 30, c: 36, h: 20, unit: 'm',
    title: 'Gartengrundstück einzäunen', 
    text: 'HÜ 1: Ein dreieckiger Garten (a = 24 m, b = 30 m, c = 36 m, h_c = 20 m) erhält einen neuen Maschendrahtzaun. Berechne den Umfang u und die Zaunkosten bei 12 € pro Meter.',

  {

    title: 'Rechtwinklige Dachfläche', 
    text: 'HÜ 2: Eine rechtwinklige Dachfläche hat die Katheten 9 m und 12 m. Berechne die Fläche A in m² und die Eindeckungskosten bei 45 € pro m².',
    costPerUnit: 45, costName: 'Dachkosten', costUnit: '€', costType: 'A'
  },
  { 
    section: 'Hausübung', num: 3, type: 'general', a: 18, b: 22, c: 25, h: 16, unit: 'm',
    title: 'Bauplatz Raseneinsaat', 
    text: 'HÜ 3: Auf einem dreieckigen Bauplatz (c = 25 m, h_c = 16 m) soll Rasen gesät werden. Berechne die Fläche A in m² und die Saatgutkosten bei 1,50 € pro m².',
    costPerUnit: 1.5, costName: 'Saatgutkosten', costUnit: '€', costType: 'A'
  },
  { 
    section: 'Hausübung', num: 4, type: 'right', a: 60, b: 80, c: 100, unit: 'cm',
    title: 'Verkehrsschild streichen', 
    text: 'HÜ 4: Ein rechtwinkliges Warnschild mit Katheten 60 cm und 80 cm erhält eine Reflexionsfolie. Berechne A in cm² und die Kosten bei 0,05 € pro cm².',
    costPerUnit: 0.05, costName: 'Folienkosten', costUnit: '€', costType: 'A'
  }
];

const state = { solved:

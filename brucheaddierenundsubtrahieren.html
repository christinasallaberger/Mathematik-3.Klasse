<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brüche multiplizieren und dividieren</title>

<style>
  :root {
    --violett: #7b3f83;
    --blau: #254f8e;
    --gruen: #198754;
    --rot: #c2363d;
    --orange: #b56b16;
    --text: #203047;
    --rahmen: #cad5e5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px;
    background: #eef2f8;
    color: var(--text);
    font-family: Arial, sans-serif;
  }

  main {
    max-width: 900px;
    margin: auto;
    padding: 24px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 6px 24px #0002;
  }

  h1 { color: var(--violett); margin-top: 0; }
  h2 { color: var(--blau); }
  p { line-height: 1.55; }

  .name-box {
    padding: 12px;
    margin: 16px 0;
    background: #f4f6fb;
    border-radius: 10px;
  }

  .name-box input {
    width: 280px;
    max-width: 100%;
    text-align: left;
  }

  .progress-frame {
    height: 12px;
    background: #dbe3f0;
    border-radius: 8px;
    overflow: hidden;
  }

  #progress {
    height: 100%;
    width: 0;
    background: var(--violett);
    transition: width .25s;
  }

  .task {
    margin: 22px 0;
    padding: 24px;
    border: 2px solid #e3d4e6;
    border-radius: 14px;
    background: #fbf4fb;
    font-size: 28px;
    text-align: center;
    line-height: 2;
  }

  .fraction {
    display: inline-flex;
    flex-direction: column;
    vertical-align: middle;
    text-align: center;
    min-width: 32px;
    line-height: 1.2;
  }

  .fraction-top {
    padding: 3px 8px;
    border-bottom: 2px solid currentColor;
  }

  .fraction-bottom { padding: 3px 8px; }

  .signed,
  .mixed {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .step {
    margin-top: 18px;
    padding: 18px;
    border: 1px solid var(--rahmen);
    border-radius: 12px;
  }

  .tip {
    padding: 12px;
    background: #f8f1f9;
    border-left: 5px solid var(--violett);
    border-radius: 6px;
    line-height: 1.6;
  }

  .entry {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin: 22px 0;
    font-size: 24px;
  }

  .factor-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 5px;
  }

  input,
  select {
    width: 70px;
    padding: 8px;
    border: 2px solid #9baec7;
    border-radius: 7px;
    font-size: 18px;
    text-align: center;
    background: white;
    color: var(--text);
  }

  input:focus,
  select:focus {
    outline: 3px solid #c5d9fc;
  }

  button {
    padding: 11px 16px;
    border: none;
    border-radius: 8px;
    color: white;
    background: var(--blau);
    font-size: 16px;
    cursor: pointer;
    margin: 4px;
  }

  button:disabled {
    opacity: .65;
    cursor: default;
  }

  .skip { background: var(--orange); }
  .ok { color: var(--gruen); }
  .bad { color: var(--rot); }

  #message {
    min-height: 25px;
    font-weight: bold;
  }

  .solution,
  .summary {
    padding: 15px;
    background: #f2f6fb;
    border-radius: 10px;
    line-height: 2;
  }

  .notice {
    padding: 12px;
    margin: 16px 0;
    background: #fff4e5;
    border-left: 5px solid var(--orange);
    border-radius: 6px;
  }

  .table-wrapper { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
    font-size: .95rem;
  }

  td,
  th {
    padding: 8px;
    border: 1px solid var(--rahmen);
    text-align: left;
    vertical-align: top;
  }

  th { background: #e7edf7; }
  .skipped-status { color: #a65300; font-weight: bold; }
  .completed-status { color: #167447; font-weight: bold; }

  details { margin: 12px 0; }
  [hidden] { display: none !important; }

  @media (max-width: 650px) {
    body { padding: 0; }
    main { padding: 16px; border-radius: 0; }
    .task { font-size: 23px; }
    input, select { width: 60px; }
  }

  @media print {
    body { background: white; padding: 0; }
    main { box-shadow: none; max-width: none; }
    button, .name-box, .progress-frame { display: none; }
    details { display: block; }
  }
</style>
</head>

<body>
<main>
  <h1>Brüche multiplizieren und dividieren</h1>

  <p>
    Gemischte Zahlen zuerst umwandeln, anschließend noch einmal
    anschreiben und Schritt für Schritt rechnen.
  </p>

  <div class="name-box">
    <label for="studentName">Name:</label>
    <input id="studentName" placeholder="Vor- und Nachname">
  </div>

  <p id="counter"></p>

  <div class="progress-frame">
    <div id="progress"></div>
  </div>

  <div id="work">
    <div class="task" id="task"></div>

    <section class="step">
      <h2 id="stepTitle"></h2>
      <div id="stepInfo"></div>
      <div class="entry" id="entry"></div>

      <button id="checkButton">Überprüfen</button>
      <button class="skip" id="skipButton">
        Ganze Aufgabe überspringen
      </button>

      <p id="message" aria-live="polite"></p>
    </section>
  </div>

  <section id="taskFinished" hidden>
    <h2>Geschafft!</h2>
    <div class="solution" id="solution"></div>
    <p><button id="nextButton">Nächste Aufgabe</button></p>
  </section>

  <section id="endScreen" hidden>
    <h2>Lehrerübersicht</h2>
    <div class="summary" id="summary"></div>
    <p>
      <button id="restartButton">Noch einmal üben</button>
      <button id="printButton">Übersicht drucken</button>
    </p>
  </section>
</main>

<script>
/*
  Aufgabenformat:
  op, erster Zähler, erster Nenner, zweiter Zähler, zweiter Nenner,
  erstes Vorzeichen, zweites Vorzeichen,
  erste gemischte Zahl, zweite gemischte Zahl

  Gemischte Zahl: [ganze Zahl, Zähler, Nenner]
*/
const tasks = [
  ["mul", 1, 3, 4, 6, "+", "+", null, null],
  ["div", 4, 7, 2, 9, "-", "+", null, null],
  ["mul", 2, 3, 3, 7, "-", "+", null, null],
  ["div", 5, 8, 15, 16, "+", "-", null, null],
  ["mul", 6, 9, 3, 8, "-", "+", null, null],
  ["div", 7, 12, 14, 15, "+", "+", null, null],

  ["mul", 3, 2, 7, 3, "+", "+", [1, 1, 2], [2, 1, 3]],
  ["div", 9, 4, 3, 5, "-", "+", [2, 1, 4], null],
  ["mul", 3, 4, 5, 3, "+", "-", null, [1, 2, 3]],
  ["div", 8, 5, 8, 3, "-", "-", [1, 3, 5], [2, 2, 3]],

  // Neue Aufgabe 11: +4 2/3 · -5/14 = -5/3
  ["mul", 14, 3, 5, 14, "+", "-", [4, 2, 3], null],

  ["div", 5, 6, 5, 4, "-", "+", null, [1, 1, 4]],
  ["mul", 12, 5, 3, 2, "-", "-", [2, 2, 5], [1, 1, 2]],

  // Neue Aufgabe 14: +3 3/4 : -7/8 = -30/7
  ["div", 15, 4, 7, 8, "+", "-", [3, 3, 4], null],

  ["mul", 7, 9, 15, 7, "-", "+", null, [2, 1, 7]]
];

const $ = id => document.getElementById(id);

let taskIndex = 0;
let stepIndex = 0;
let stepQueue = [];
let current = {};
let currentRecord = {};
let records = [];
let locked = false;
let transitionTimer = null;

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
}

function gcd(a, b) {
  while (b !== 0) {
    [a, b] = [b, a % b];
  }
  return a;
}

function signSymbol(sign) {
  return sign === "-" ? "−" : "+";
}

function fraction(top, bottom) {
  return `
    <span class="fraction">
      <span class="fraction-top">${top}</span>
      <span class="fraction-bottom">${bottom}</span>
    </span>
  `;
}

function signedFraction(sign, top, bottom) {
  return `
    <span class="signed">
      <span>${signSymbol(sign)}</span>
      ${fraction(top, bottom)}
    </span>
  `;
}

function numberDisplay(sign, top, bottom, mixed) {
  if (!mixed) {
    return signedFraction(sign, top, bottom);
  }

  return `
    <span class="signed">
      <span>${signSymbol(sign)}</span>
      <span class="mixed">
        <span>${mixed[0]}</span>
        ${fraction(mixed[1], mixed[2])}
      </span>
    </span>
  `;
}

function numberInput(id, label) {
  return `
    <input
      id="${id}"
      type="number"
      min="0"
      step="1"
      aria-label="${label}"
    >
  `;
}

function signInput() {
  return `
    <select id="sign" aria-label="Vorzeichen">
      <option value="">?</option>
      <option value="+">+</option>
      <option value="-">−</option>
    </select>
  `;
}

function factorInputs() {
  return signInput() + fraction(
    `<span class="factor-row">
      ${numberInput("a", "Erster Zählerfaktor")}
      <span>·</span>
      ${numberInput("c", "Zweiter Zählerfaktor")}
    </span>`,
    `<span class="factor-row">
      ${numberInput("b", "Erster Nennerfaktor")}
      <span>·</span>
      ${numberInput("d", "Zweiter Nennerfaktor")}
    </span>`
  );
}

function resultInputs(sign) {
  return signedFraction(
    sign,
    numberInput("numerator", "Zähler"),
    numberInput("denominator", "Nenner")
  );
}

function taskDisplay(task) {
  return `
    (${numberDisplay(task[5], task[1], task[2], task[7])})
    ${task[0] === "mul" ? "·" : ":"}
    (${numberDisplay(task[6], task[3], task[4], task[8])})
  `;
}

function taskText(task) {
  function text(sign, top, bottom, mixed) {
    const number = mixed
      ? `${mixed[0]} ${mixed[1]}/${mixed[2]}`
      : `${top}/${bottom}`;

    return `(${sign}${number})`;
  }

  return `
    ${text(task[5], task[1], task[2], task[7])}
    ${task[0] === "mul" ? "·" : ":"}
    ${text(task[6], task[3], task[4], task[8])}
  `.trim();
}

function setMessage(text, correct) {
  $("message").textContent = text;
  $("message").className = correct ? "ok" : "bad";
}

function setButtonsDisabled(disabled) {
  $("checkButton").disabled = disabled;
  $("skipButton").disabled = disabled;
}

function startTask() {
  const task = tasks[taskIndex];

  current = {
    task: task,
    a: task[1],
    b: task[2],
    c: task[0] === "div" ? task[4] : task[3],
    d: task[0] === "div" ? task[3] : task[4],
    sign: task[5] === task[6] ? "+" : "-"
  };

  currentRecord = {
    number: taskIndex + 1,
    task: taskText(task),
    errors: [],
    completedSteps: [],
    skipped: false,
    remainingSteps: []
  };

  stepQueue = [];

  [7, 8].forEach(mixedPosition => {
    if (task[mixedPosition]) {
      stepQueue.push({
        kind: "convert",
        title: mixedPosition === 7
          ? "Erste gemischte Zahl umwandeln"
          : "Zweite gemischte Zahl umwandeln",
        mixedPosition: mixedPosition
      });
    }
  });

  if (stepQueue.length > 0) {
    stepQueue.push({
      kind: "rewrite",
      title: "Unechte Brüche noch einmal anschreiben"
    });
  }

  stepQueue.push(
    {
      kind: "long",
      title: task[0] === "div"
        ? "Langer Bruchstrich – zweiten Bruch umdrehen"
        : "Langer Bruchstrich"
    },
    {
      kind: "reduce",
      title: "Einmal kürzen – Kürzzahl notieren"
    },
    {
      kind: "multiply",
      title: "Faktoren multiplizieren"
    }
  );

  stepIndex = 0;

  $("counter").textContent =
    `Aufgabe ${taskIndex + 1} von ${tasks.length}`;

  $("progress").style.width =
    `${taskIndex / tasks.length * 100}%`;

  $("task").innerHTML = taskDisplay(task);
  $("work").hidden = false;
  $("taskFinished").hidden = true;

  showStep();
}

function showStep() {
  locked = false;
  setButtonsDisabled(false);

  if (stepIndex >= stepQueue.length) {
    showTaskSolution();
    return;
  }

  const step = stepQueue[stepIndex];
  const task = current.task;

  let info = "";
  let entry = "";

  if (step.kind === "convert") {
    const position = step.mixedPosition;
    const mixed = task[position];
    const sign = task[position === 7 ? 5 : 6];

    info = `
      <div class="tip">
        Ganze Zahl · Nenner + Zähler.<br>
        Der Nenner bleibt gleich.
      </div>
      <p>${numberDisplay(sign, 0, 0, mixed)} = ?</p>
    `;

    entry = resultInputs(sign);
  }

  if (step.kind === "rewrite") {
    info = `
      <div class="tip">
        Die umgewandelten Brüche bleiben sichtbar.
        Schreibe beide Brüche noch einmal auf.
      </div>
      <p>
        ${signedFraction(task[5], task[1], task[2])}
        ${task[0] === "mul" ? "·" : ":"}
        ${signedFraction(task[6], task[3], task[4])}
      </p>
    `;

    entry = `
      (${signedFraction(
        task[5],
        numberInput("a", "Erster Zähler"),
        numberInput("b", "Erster Nenner")
      )})
      ${task[0] === "mul" ? "·" : ":"}
      (${signedFraction(
        task[6],
        numberInput("c", "Zweiter Zähler"),
        numberInput("d", "Zweiter Nenner")
      )})
    `;
  }

  if (step.kind === "long") {
    info = `
      <p>
        ${signedFraction(task[5], task[1], task[2])}
        ${task[0] === "mul" ? "·" : ":"}
        ${signedFraction(task[6], task[3], task[4])}
      </p>
    `;

    if (task[0] === "div") {
      info += `
        <div class="tip">
          Bei einer Division wird der zweite Bruch umgedreht:
          ${signedFraction(task[6], task[4], task[3])}.
          Danach wird multipliziert.
        </div>
      `;
    }

    info += "<p>Trage die Faktoren auf den langen Bruchstrich ein.</p>";
    entry = factorInputs();
  }

  if (step.kind === "reduce") {
    info = `
      <div class="tip">
        Kürze genau ein Zähler-Nenner-Paar durch dieselbe Zahl.
        Über Kreuz oder innerhalb eines Bruchs ist erlaubt.
        Die anderen beiden Faktoren bleiben unverändert.<br>
        Falls nichts kürzbar ist, trage als Kürzzahl 1 ein.
      </div>
      <p>
        ${signedFraction(
          current.sign,
          `${current.a} · ${current.c}`,
          `${current.b} · ${current.d}`
        )}
        = ?
      </p>
    `;

    entry = `
      <label>
        gekürzt durch
        ${numberInput("divisor", "Kürzzahl")}
      </label>
      ${factorInputs()}
    `;
  }

  if (step.kind === "multiply") {
    const r = current.reduced;

    info = `
      <div class="tip">
        Du hast durch ${current.divisor} gekürzt.<br>
        Multipliziere oben ${r.a} · ${r.c}
        und unten ${r.b} · ${r.d}.
      </div>
      <p>
        ${signedFraction(
          current.sign,
          `${r.a} · ${r.c}`,
          `${r.b} · ${r.d}`
        )}
        = ?
      </p>
    `;

    entry = resultInputs(current.sign);
  }

  if (step.kind === "final") {
    info = `
      <p>
        ${signedFraction(
          current.sign,
          current.rawNumerator,
          current.rawDenominator
        )}
        = ?
      </p>
      <div class="tip">
        Kürze den Ergebnisbruch vollständig und notiere die Kürzzahl.
      </div>
    `;

    entry = `
      <label>
        gekürzt durch
        ${numberInput("divisor", "Kürzzahl")}
      </label>
      ${resultInputs(current.sign)}
    `;
  }

  if (step.kind === "mixed") {
    info = `
      <p>
        ${signedFraction(
          current.sign,
          current.finalNumerator,
          current.finalDenominator
        )}
        = ?
      </p>
      <div class="tip">
        Teile den Zähler durch den Nenner.
        Der Rest wird zum Zähler des Bruchteils.
      </div>
    `;

    entry = `
      <span>${signSymbol(current.sign)}</span>
      ${numberInput("whole", "Ganze Zahl")}
      ${fraction(
        numberInput("numerator", "Restzähler"),
        numberInput("denominator", "Nenner")
      )}
    `;
  }

  $("stepTitle").textContent = step.title;
  $("stepInfo").innerHTML = info;
  $("entry").innerHTML = entry;
  $("message").textContent = "";
}

function validSingleReduction(values, divisor) {
  const original = [
    current.a,
    current.b,
    current.c,
    current.d
  ];

  const entered = [
    values.a,
    values.b,
    values.c,
    values.d
  ];

  const pairs = [
    [0, 1],
    [0, 3],
    [2, 1],
    [2, 3]
  ];

  if (!Number.isInteger(divisor) || divisor < 1) {
    return false;
  }

  const reductionPossible = pairs.some(([top, bottom]) => {
    return gcd(original[top], original[bottom]) > 1;
  });

  if (divisor === 1) {
    return !reductionPossible &&
      original.every((number, index) => number === entered[index]);
  }

  return pairs.some(([top, bottom]) => {
    if (
      original[top] % divisor !== 0 ||
      original[bottom] % divisor !== 0
    ) {
      return false;
    }

    const reduced = [...original];

    reduced[top] /= divisor;
    reduced[bottom] /= divisor;

    return reduced.every((number, index) => {
      return number === entered[index];
    });
  });
}

function readInputs() {
  const fields = [
    ...$("entry").querySelectorAll("input, select")
  ];

  if (fields.some(field => field.value.trim() === "")) {
    setMessage("Bitte fülle alle Felder aus.", false);
    return null;
  }

  const numberFields = fields.filter(field => {
    return field.tagName === "INPUT";
  });

  if (numberFields.some(field => {
    const value = Number(field.value);
    return !Number.isInteger(value) || value < 0;
  })) {
    setMessage(
      "Bitte ganze, nicht negative Zahlen eintragen.",
      false
    );
    return null;
  }

  return Object.fromEntries(fields.map(field => [
    field.id,
    field.tagName === "SELECT"
      ? field.value
      : Number(field.value)
  ]));
}

function checkAnswer() {
  if (locked) return;

  const values =

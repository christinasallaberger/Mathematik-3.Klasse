<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Textaufgaben: Dreiecke & Sachrechnen – Umfang & Flächeninhalt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdfdf9; --grid:#d6e4f2; --ink:#1b2a4a; --pen:#1d4ed8; --muted:#5b6b85;
  --red:#c62828; --red-soft:#fdecea; --green:#2e7d32; --green-soft:#e6f4e7;
  --marker:#ffe36e; --tri:#eaf1fb; --card:#ffffff; --line:#c9d6e6; --btn:#1b2a4a; --btn-ink:#ffffff;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151b26; --grid:#222d3e; --ink:#e6ecf5; --pen:#8fb1ff; --muted:#9aa8bf;
    --red:#ff7a7a; --red-soft:#3a1e22; --green:#6fd17a; --green-soft:#17301c;
    --marker:#7a6516; --tri:#1e2a3e; --card:#1b2231; --line:#33415a; --btn:#e6ecf5; --btn-ink:#151b26;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif; font-size:17px; line-height:1.5;
  padding-bottom:280px;
}
.wrap{max-width:1100px;margin:0 auto;padding:24px 18px 60px}
header h1{font-family:"Patrick Hand",cursive;font-weight:400;font-size:clamp(32px,5.5vw,46px);line-height:1.05;margin:0 0 6px;color:var(--pen)}
header p{margin:0 0 16px;color:var(--muted);max-width:65ch}

/* Aufgaben-Leiste oben */
.taskbar{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:20px;display:flex;flex-direction:column;gap:8px}
.taskbar-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.taskbar-label{font-size:13px;font-weight:700;color:var(--muted);width:95px;flex:none}
.tbadge{font-family:"Patrick Hand",cursive;font-size:18px;width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:all 0.2s}
.tbadge:hover{border-color:var(--pen);background:var(--tri)}
.tbadge.active{background:var(--pen);color:#fff;border-color:var(--pen)}
.tbadge.solved-badge{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.tbadge.solved-badge.active{background:var(--green);color:#fff}

.controls{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px}
.ctl-label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px}
.namein{font:inherit;font-size:16px;padding:7px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);width:260px;max-width:100%}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.sheet{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px}
.task{font-size:19px;margin:0 0 12px;line-height:1.4}
.task b{font-family:"Patrick Hand",cursive;font-size:24px;color:var(--pen);font-weight:400}
svg{width:100%;height:auto;display:block}
.side{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.side.height-line{stroke:var(--red);stroke-width:2.5;stroke-dasharray:6 4}
.side.selected{stroke:var(--pen);stroke-width:5}
.tri{fill:var(--tri)}
.ra{fill:none;stroke:var(--ink);stroke-width:2}
.dot{fill:var(--ink)}
.lbl{font-family:"Patrick Hand",cursive;font-size:18px;fill:var(--ink)}
.hit{stroke:transparent;stroke-width:34;stroke-linecap:round;cursor:pointer;pointer-events:stroke}
.tapnote{text-anchor:middle;font-weight:700;fill:var(--pen);font-size:15px}

.way-title{margin:18px 0 4px;font-size:15px;color:var(--muted)}
.way{font-family:"Patrick Hand",cursive;font-size:22px;line-height:1.5;color:var(--pen);min-height:44px;border-left:3px solid var(--pen);padding-left:14px}
.way:empty::before{content:"Hier entsteht dein Rechenweg.";color:var(--muted);font-size:18px}
.wline{animation:write .35s ease-out}
@keyframes write{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.wline.final{display:block;border-top:2px solid var(--pen);margin-top:6px;padding-top:4px;font-weight:bold}

.steps{display:flex;flex-direction:column;gap:12px}
.step{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.step.solved{border-color:var(--green)}
.step-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:15px}
.step.solved .num{background:var(--green);border-color:var(--green);color:var(--card)}
.step h3{margin:0;font-size:18px}
.step p{margin:0 0 8px}

.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-family:"Patrick Hand",cursive;font-size:21px;min-width:56px;padding:4px 14px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){background:var(--tri)}
.opt.good{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.opt.wrongb{background:var(--red-soft);border-color:var(--red);color:var(--red);text-decoration:line-through}
.opt:disabled{cursor:default}

.eq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:"Patrick Hand",cursive;font-size:23px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px}
.frac-top{border-bottom:2px solid var(--ink);padding-bottom:2px;display:flex;align-items:center;gap:4px}
.frac-bot{padding-top:2px;display:flex;align-items:center;justify-content:center}
.n{font:inherit;font-family:"Patrick Hand",cursive;font-size:21px;width:75px;padding:2px 4px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--pen);text-align:center}
.n:focus{outline:3px solid var(--pen)}
.n.wide{width:110px}
.check,.next{font:inherit;font-size:16px;font-weight:700;padding:8px 16px;border-radius:10px;border:0;background:var(--btn);color:var(--btn-ink);cursor:pointer}
.fb{font-size:15px;margin-top:8px}
.fb:empty{display:none}
.fb.bad{color:var(--red);background:var(--red-soft);padding:8px 10px;border-radius:8px}
.fb.ok{color:var(--green)}
.score{font-size:15px;color:var(--muted);margin:0 0 12px}
.namerow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.summary{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:20px}
.summary h2{font-family:"Patrick Hand",cursive;font-size:32px;color:var(--pen);margin:0 0 14px}
.tablewrap{overflow-x:auto;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.tag{font-size:14px;color:var(--muted);font-weight:bold}
.homework-box{background:var(--tri);border:2px dashed var(--pen);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:15px}
.homework-box h4{margin:0 0 6px;color:var(--pen);font-size:17px}
.codebox{background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:8px 12px;font-family:monospace;font-size:18px;font-weight:bold;color:var(--pen);display:inline-block;margin:6px 0}

.keypad{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:3px solid var(--pen);padding:10px 14px;box-shadow:0 -4px 20px rgba(0,0,0,0.15);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:999}
.keypad-header{display:flex;justify-content:space-between;width:100%;max-width:380px;font-size:14px;font-weight:bold;color:var(--muted)}
.keypad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:380px}
.keybtn{font-family:"Patrick Hand",cursive;font-size:24px;padding:8px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer;text-align:center}
.keybtn:active{background:var(--tri)}
.keybtn.action{background:var(--btn);color:var(--btn-ink);font-size:18px;font-family:sans-serif}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Textaufgaben: Dreiecke & Sachrechnen</h1>
    <p>Berechne Umfang, Flächeninhalt und Folgekosten bei Alltagsaufgaben. (6 Schulübungen & 4 Hausübungen)</p>
  </header>

  <!-- Aufgaben-Leiste oben -->
  <div class="taskbar">
    <div class="taskbar-row">
      <span class="taskbar-label">Schulübung:</span>
      <div id="badgesSUE" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
    </div>
    <div class="taskbar-row" style="border-top:1px solid var(--line); padding-top:6px;">
      <span class="taskbar-label">Hausübung:</span>
      <div id="badgesHUE" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
    </div>
  </div>

  <div class="controls">
    <div>
      <label class="ctl-label" for="name">1. Dein Name</label>
      <div class="namerow">
        <input id="name" class="namein" placeholder="Vor- und Nachname">
        <button class="next" id="nameOk">Starten</button>
      </div>
    </div>
    <div style="border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px;">
      <label class="ctl-label" for="codeInp">2. Bereits einen Speicher-Code von einem anderen Gerät?</label>
      <div class="namerow">
        <input id="codeInp" class="namein" placeholder="Zahlencode eingeben" inputmode="numeric">
        <button class="next" id="codeOk" style="background:var(--muted)">Fortschritt laden</button>
      </div>
    </div>
  </div>

  <p class="score" id="score">Gelöst: 0 von 10, davon fehlerfrei: 0</p>

  <div class="grid">
    <div class="sheet">
      <p class="task" id="taskText"></p>
      <div id="fig"></div>
      <p class="way-title">Rechenweg</p>
      <div class="way" id="way"></div>
    </div>
    <div>
      <div class="steps" id="steps"></div>
      <div class="done" id="done" hidden style="margin-top:16px;">
        <p id="doneText" style="font-size:18px; margin-bottom:12px;"></p>
        <button class="next" id="nextBtn">Nächste Aufgabe</button>
      </div>
    </div>
  </div>

  <section class="summary" id="summary" hidden></section>
</div>

<!-- Virtuelle Zusatztastatur -->
<div class="keypad" id="keypad" hidden>
  <div class="keypad-header">
    <span>Bildschirm-Tastatur (Tippen oder physisch nutzen)</span>
    <span style="cursor:pointer; color:var(--red)" onclick="closeKeypad()">✕ Schließen</span>
  </div>
  <div class="keypad-grid">
    <button class="keybtn" onclick="keyPress('7')">7</button>
    <button class="keybtn" onclick="keyPress('8')">8</button>
    <button class="keybtn" onclick="keyPress('9')">9</button>
    <button class="keybtn" onclick="keyPress('4')">4</button>
    <button class="keybtn" onclick="keyPress('5')">5</button>
    <button class="keybtn" onclick="keyPress('6')">6</button>
    <button class="keybtn" onclick="keyPress('1')">1</button>
    <button class="keybtn" onclick="keyPress('2')">2</button>
    <button class="keybtn" onclick="keyPress('3')">3</button>
    <button class="keybtn" onclick="keyPress(',')">,</button>
    <button class="keybtn" onclick="keyPress('0')">0</button>
    <button class="keybtn action" onclick="keyPress('back')">⌫</button>
  </div>
</div>

<script>
const TOTAL_TASKS = 10;
const PRESETS = [
  // --- SCHULÜBUNG (6 Aufgaben) ---
  { 
    section: 'Schulübung', num: 1, type: 'general', a: 900, b: 1400, c: 1600, h: 800, unit: 'm',
    title: 'Waldstück aufforsten', 
    text: 'Ein dreieckiges Waldstück soll mit Fichten neu aufgeforstet werden. Wie groß ist die Fläche A in m² und wie teuer ist das Holz, wenn 1 m² Fichtenpflanzen 2,50 € kosten?',
    costPerUnit: 2.50, costName: 'Gesamtkosten', costUnit: '€', costType: 'A',
    answerText: 'Das Aufforsten des Waldstücks kostet insgesamt'
  },
  { 
    section: 'Schulübung', num: 2, type: 'general', a: 800, b: 800, c: 1480, h: 680, unit: 'cm',
    title: 'Hausgiebel verschalen', 
    text: 'Der Giebel eines Hauses soll mit Holz verschalt werden (Grundseite c = 14,8 m = 1480 cm, Höhe h_c = 6,8 m = 680 cm). Berechne den Flächeninhalt A in m² (1 m² = 10 000 cm²) und die Holzkosten bei 38 € pro m².',
    costPerUnit: 38, costName: 'Holzkosten', costUnit: '€', costType: 'A', convertToM2: true,
    answerText: 'Die Holzverschaltung für den Giebel kostet insgesamt'
  },
  { 
    section: 'Schulübung', num: 3, type: 'general', a: 720, b: 720, c: 450, h: 700, unit: 'cm',
    title: 'Kirchturmdach neu decken', 
    text: 'Ein Kirchturmdach besteht aus 4 gleichen dreieckigen Flächen (c = 4,5 m = 450 cm, h_c = 7 m = 700 cm). Berechne die Gesamtfläche aller 4 Flächen in m² und die Gesamtkosten bei 280 € pro m²!',
    costPerUnit: 280, costName: 'Gesamtkosten (4 Flächen)', costUnit: '€', costType: 'A_multi', multiplier: 4, convertToM2: true,
    answerText: 'Die Neueindeckung des Kirchturmdachs kostet insgesamt'
  },
  { 
    section: 'Schulübung', num: 4, type: 'right', a: 6, b: 8, c: 10, unit: 'm',
    title: 'Rechtwinkliges Blumenbeet', 
    text: 'Ein rechtwinkliges Blumenbeet mit den Katheten a = 6 m und b = 8 m soll mit Randsteinen eingefasst werden. Berechne den Umfang u in m und den Preis für den Zaun bei 15 € pro Meter.',
    costPerUnit: 15, costName: 'Einfassungskosten', costUnit: '€', costType: 'u',
    answerText: 'Die Einfassung des Blumenbeets kostet insgesamt'
  },
  { 
    section: 'Schulübung', num: 5, type: 'right', a: 3, b: 4, c: 5, unit: 'm',
    title: 'Sonnensegel für den Garten', 
    text: 'Ein rechtwinkliges Sonnensegel besitzt die Katheten 3 m und 4 m. Wie viel m² Stoff A werden benötigt und was kostet das Segel bei 22 € pro m²?',
    costPerUnit: 22, costName: 'Segelkosten', costUnit: '€', costType: 'A',
    answerText: 'Das Sonnensegel kostet im Gesamtpreis'
  },
  { 
    section: 'Schulübung', num: 6, type: 'general', a: 35, b: 42, c: 50, h: 28, unit: 'm',
    title: 'Dreieckiger Parkteich', 
    text: 'Ein Ententeich im Park ist dreieckig abgegrenzt (a = 35 m, b = 42 m, c = 50 m). Wie lang ist the Sicherheitszaun um den gesamten Teich (Umfang u) und was kostet der Zaun bei 18 € / m?',
    costPerUnit: 18, costName: 'Zaunkosten', costUnit: '€', costType: 'u',
    answerText: 'Der Sicherheitszaun um den Parkteich kostet insgesamt'
  },

  // --- HAUSÜBUNG (4 Aufgaben) ---
  { 
    section: 'Hausübung', num: 1, type: 'general', a: 24, b: 30, c: 36, h: 20, unit: 'm',
    title: 'Gartengrundstück einzäunen', 
    text: 'HÜ 1: Ein dreieckiger Garten (a = 24 m, b = 30 m, c = 36 m, h_c = 20 m) erhält einen neuen Maschendrahtzaun. Berechne den Umfang u und die Zaunkosten bei 12 € pro Meter.',
    costPerUnit: 12, costName: 'Zaunkosten', costUnit: '€', costType: 'u',
    answerText: 'Für die Einzäunung des Gartens betragen the Gesamtkosten'
  },
  { 
    section: 'Hausübung', num: 2, type: 'right', a: 9, b: 12, c: 15, unit: 'm',
    title: 'Rechtwinklige Dachfläche', 
    text: 'HÜ 2: Eine rechtwinklige Dachfläche hat die Katheten 9 m und 12 m. Berechne die Fläche A in m² und die Eindeckungskosten bei 45 € pro m².',
    costPerUnit: 45, costName: 'Dachkosten', costUnit: '€', costType: 'A',
    answerText: 'Die Eindeckung der Dachfläche kostet insgesamt'
  },
  { 
    section: 'Hausübung', num: 3, type: 'general', a: 18, b: 22, c: 25, h: 16, unit: 'm',
    title: 'Bauplatz Raseneinsaat', 
    text: 'HÜ 3: Auf einem dreieckigen Bauplatz (c = 25 m, h_c = 16 m) soll Rasen gesät werden. Berechne die Fläche A in m² und die Saatgutkosten bei 1,50 € pro m².',
    costPerUnit: 1.5, costName: 'Saatgutkosten', costUnit: '€', costType: 'A',
    answerText: 'Die Saatgutkosten für den Bauplatz belaufen sich auf insgesamt'
  },
  { 
    section: 'Hausübung', num: 4, type: 'right', a: 60, b: 80, c: 100, unit: 'cm',
    title: 'Verkehrsschild streichen', 
    text: 'HÜ 4: Ein rechtwinkliges Warnschild mit Katheten 60 cm und 80 cm erhält eine Reflexionsfolie. Berechne A in cm² und die Kosten bei 0,05 € pro cm².',
    costPerUnit: 0.05, costName: 'Folienkosten', costUnit: '€', costType: 'A',
    answerText: 'Die Kosten für die Reflexionsfolie betragen insgesamt'
  }
];

const state = { solved: 0, perfect: 0, log: [], nameLocked: false, idx: 0, name: '' };
let task = null, activeInput = null;

const $ = s => document.querySelector(s);
function fmt(x){ return String(Math.round(x * 100) / 100).replace('.', ','); }
function parseNum(s){ if(!s) return NaN; return Number(String(s).trim().replace(',', '.')); }

function openKeypad(inputEl) {
  activeInput = inputEl;
  $('#keypad').hidden = false;
}
function closeKeypad() {
  $('#keypad').hidden = true;
  activeInput = null;
}
function keyPress(key) {
  if (!activeInput) return;
  if (key === 'back') {
    activeInput.value = activeInput.value.slice(0, -1);
  } else {
    if (key === ',' && activeInput.value.includes(',')) return;
    activeInput.value += key;
  }
  activeInput.dispatchEvent(new Event('input'));
}

document.addEventListener('focusin', e => {
  if (e.target.tagName === 'INPUT' && e.target.classList.contains('n')) {
    openKeypad(e.target);
  }
});

function renderBadges() {
  const sList = PRESETS.filter(p => p.section === 'Schulübung');
  const hList = PRESETS.filter(p => p.section === 'Hausübung');

  $('#badgesSUE').innerHTML = sList.map(p => {
    const globalIdx = PRESETS.indexOf(p);
    const isDone = globalIdx < state.idx;
    const isCurr = globalIdx === state.idx;
    let cls = 'tbadge';
    if (isDone) cls += ' solved-badge';
    if (isCurr) cls += ' active';
    return `<button class="${cls}" onclick="jumpTask(${globalIdx})">SÜ${p.num}</button>`;
  }).join('');

  $('#badgesHUE').innerHTML = hList.map(p => {
    const globalIdx = PRESETS.indexOf(p);
    const isDone = globalIdx < state.idx;
    const isCurr = globalIdx === state.idx;
    let cls = 'tbadge';
    if (isDone) cls += ' solved-badge';
    if (isCurr) cls += ' active';
    return `<button class="${cls}" onclick="jumpTask(${globalIdx})">HÜ${p.num}</button>`;
  }).join('');
}

function jumpTask(index) {
  if (!state.nameLocked) {
    alert('Bitte gib zuerst oben deinen Namen ein.');
    return;
  }
  state.idx = index;
  newTask();
}

function generateCode() {
  let hash = 0;
  const str = state.name + state.solved + state.perfect + state.idx;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash % 900000 + 100000);
}

function updateScore() {
  $('#score').textContent = (state.name ? state.name + ': ' : '') + `Gelöst: ${state.solved} von ${TOTAL_TASKS}, davon fehlerfrei: ${state.perfect}`;
  renderBadges();
}

function saveToLocalStorage() {
  if (!state.nameLocked) return;
  const data = { name: state.name, solved: state.solved, perfect: state.perfect, idx: state.idx, log: state.log };
  localStorage.setItem('dreieck_sach_app_' + state.name.toLowerCase().replace(/\s+/g, ''), JSON.stringify(data));
}

function newTask() {
  if (state.idx >= TOTAL_TASKS) {
    showSummary();
    return;
  }
  const p = PRESETS[state.idx];
  
  if (p.type === 'right') {
    task = { ...p, u: p.a+p.b+p.c, A: (p.a*p.b)/2, selected: new Set(), errors: 0, t0: Date.now() };
  } else {
    task = { ...p, u: p.a+p.b+p.c, A: (p.c*p.h)/2, selected: new Set(), errors: 0, t0: Date.now() };
  }

  let targetVal = 0;
  if (p.costType === 'u') targetVal = task.u;
  else if (p.costType === 'A') {
    targetVal = p.convertToM2 ? task.A / 10000 : task.A;
  } else if (p.costType === 'A_multi') {
    const singleM2 = p.convertToM2 ? task.A / 10000 : task.A;
    targetVal = singleM2 * p.multiplier;
  }
  task.totalCost = targetVal * p.costPerUnit;

  $('#steps').innerHTML = '';
  $('#way').innerHTML = '';
  $('#done').hidden = true;
  $('#summary').hidden = true;
  $('.grid').hidden = false;
  $('.controls').hidden = false;
  $('#score').hidden = false;

  const tagText = `${p.section} ${p.num} (Gesamt: ${state.idx + 1}/${TOTAL_TASKS}) · ${p.title}`;
  $('#taskText').innerHTML = `<span class="tag">${tagText}</span><br>${p.text}`;

  draw();
  updateScore();

  if (!state.nameLocked) {
    task.waiting = true;
    $('#steps').innerHTML = '<div class="step"><p>Gib bitte zuerst oben deinen Namen ein oder nutze einen Speicher-Code.</p></div>';
    return;
  }
  stepWhatToCalculate();
}

function draw() {
  const W = 520, H = 300;
  let lines = '', hits = '', labels = '';

  if (task.type === 'right') {
    const pA = [90, 210], pB = [430, 210], pC = [90, 50];
    const segs = {
      'a': [pC, pA, `a = ${fmt(task.a)}${task.unit}`, [25, 130]],
      'b': [pA, pB, `b = ${fmt(task.b)}${task.unit}`, [260, 248]],
      'c': [pB, pC, `c = ${fmt(task.c)}${task.unit}`, [280, 115]]
    };

    lines += `<polygon class="tri" points="${pA.join(',')} ${pB.join(',')} ${pC.join(',')}"/>`;
    lines += `<path class="ra" d="M90,190 L112,190 L112,210"/><circle class="dot" cx="101" cy="200" r="2"/>`;

    for (const [key, [p1, p2, txt, pos]] of Object.entries(segs)) {
      const isSel = task.selected.has(key);
      lines += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" class="side${isSel ? ' selected' : ''}"/>`;
      if (task.selecting) {
        hits += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" class="hit" data-seg="${key}"/>`;
      }
      labels += `<text x="${pos[0]}" y="${pos[1]}" class="lbl" text-anchor="middle">${txt}</text>`;
    }
  } else {
    const scale = 0.15;
    const cPx = Math.min(task.c * scale, 300);
    const xC = 90 + (cPx * 0.52);
    const yC = 210 - Math.min(task.h * scale, 140);

    const pA = [90, 210], pB = [90 + cPx, 210], pC = [xC, yC], pH = [xC, 210];
    const segs = {
      'b': [pA, pC, `b = ${fmt(task.b)}${task.unit}`, [(pA[0]+pC[0])/2 - 48, (pA[1]+pC[1])/2 - 12]],
      'a': [pC, pB, `a = ${fmt(task.a)}${task.unit}`, [(pC[0]+pB[0])/2 + 48, (pC[1]+pB[1])/2 - 12]],
      'c': [pA, pB, `c = ${fmt(task.c)}${task.unit}`, [90 + cPx/2, 248]],
      'h': [pC, pH, `h_c = ${fmt(task.h)}${task.unit}`, [xC + 58, (pC[1]+pH[1])/2]]
    };

    lines += `<polygon class="tri" points="${pA.join(',')} ${pB.join(',')} ${pC.join(',')}"/>`;

    for (const [key, [p1, p2, txt, pos]] of Object.entries(segs)) {
      const isSel = task.selected.has(key);
      const isH = key === 'h';
      lines += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" class="side${isH ? ' height-line' : ''}${isSel ? ' selected' : ''}"/>`;
      if (task.selecting) {
        hits += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" class="hit" data-seg="${key}"/>`;
      }
      labels += `<text x="${pos[0]}" y="${pos[1]}" class="lbl" text-anchor="middle">${txt}</text>`;
    }
  }

  const note = task.selecting ? `<text x="260" y="282" class="tapnote">👆 Klicke auf die Seiten, die du zur Berechnung benötigst!</text>` : '';
  $('#fig').innerHTML = `<svg viewBox="0 0 ${W} ${H}">${lines}${labels}${hits}${note}</svg>`;

  if (task.selecting) {
    document.querySelectorAll('#fig .hit').forEach(el => {
      el.onclick = () => {
        const seg = el.dataset.seg;
        if (task.selected.has(seg)) task.selected.delete(seg);
        else task.selected.add(seg);
        draw();
      };
    });
  }
}

function addStep(num, title, body) {
  const d = document.createElement('section');
  d.className = 'step';
  d.innerHTML = `<div class="step-head"><span class="num">${num}</span><h3>${title}</h3></div><div class="body">${body}</div><div class="fb"></div>`;
  $('#steps').appendChild(d);
  return d;
}

function wrong(d, msg) {
  task.errors++;
  const fb = d.querySelector('.fb');
  fb.className = 'fb bad';
  fb.textContent = msg;
}

function right(d, msg) {
  d.classList.add('solved');
  const fb = d.querySelector('.fb');
  fb.className = 'fb ok';
  fb.textContent = '✓ ' + msg;
  d.querySelectorAll('input,button,select').forEach(e => e.disabled = true);
  closeKeypad();
}

function addWay(text, cls = '') {
  const el = document.createElement('div');
  el.className = 'wline' + (cls ? ' ' + cls : '');
  el.textContent = text;
  $('#way').appendChild(el);
}

function stepWhatToCalculate() {
  const isU = task.costType === 'u';
  const correctChoice = isU ? 'u' : 'A';

  const d = addStep(1, 'Was ist bei dieser Aufgabe zu berechnen?', 
    `<p>Lies den Text genau durch: Geht es um den äußeren Rand (Zaun/Randstein) oder um eine Fläche (Gras, Stoff, Dach)?</p>
     <div class="opts">
       <button class="opt" data-c="u">Umfang u</button>
       <button class="opt" data-c="A">Flächeninhalt A</button>
     </div>`);

  d.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      if (btn.dataset.c === correctChoice) {
        btn.classList.add('good');
        right(d, `Richtig! Wir berechnen ${isU ? 'den Umfang u' : 'den Flächeninhalt A'}.`);
        stepSelectSides();
      } else {
        btn.classList.add('wrongb');
        wrong(d, isU ? 'Ein Zaun verläuft um die Figur herum -> Umfang u!' : 'Hier wird eine Fläche benötigt -> Flächeninhalt A!');
      }
    };
  });
}

function stepSelectSides() {
  task.selecting = true;
  draw();
  const isU = task.costType === 'u';

  const d = addStep(2, 'Welche Seiten brauchst du?', 
    `<p>Klicke auf die Seiten, die du zur Berechnung benötigst.</p>
     <button class="check">Auswahl überprüfen</button>`);

  d.querySelector('.check').onclick = () => {
    const sel = Array.from(task.selected);
    let ok = false;
    if (isU) {
      ok = sel.length === 3 && sel.includes('a') && sel.includes('b') && sel.includes('c');
    } else if (task.type === 'right') {
      ok = sel.length === 2 && sel.includes('a') && sel.includes('b');
    } else {
      ok = sel.length === 2 && sel.includes('c') && sel.includes('h');
    }

    if (ok) {
      task.selecting = false;
      draw();
      right(d, 'Richtig! Die Auswahl passt perfekt.');
      stepFormulaChoice();
    } else {
      wrong(d, isU ? 'Wähle alle 3 Außenkanten a, b und c aus.' : (task.type === 'right' ? 'Wähle die beiden Katheten a und b aus.' : 'Wähle die Grundseite c und die zugehörige Höhe h_c aus.'));
    }
  };
}

function stepFormulaChoice() {
  const isU = task.costType === 'u';
  let correctOpt = isU ? 'u = a + b + c' : (task.type === 'right' ? 'A = (a · b) / 2' : 'A = (c · h_c) / 2');
  let opt2 = isU ? 'u = a · b · c' : 'A = (a · b) / 2';
  let opt3 = isU ? 'u = (a · b) / 2' : 'A = (c · h_c) / 2';

  const d = addStep(3, 'Formel aufstellen', 
    `<p>Wähle die passende Formel aus:</p>
     <div class="opts">
       <button class="opt" data-f="${correctOpt}">${correctOpt}</button>
       <button class="opt" data-f="${opt2}">${opt2}</button>
       <button class="opt" data-f="${opt3}">${opt3}</button>
     </div>`);

  d.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      if (btn.dataset.f === correctOpt) {
        btn.classList.add('good');
        right(d, `Richtig! ${correctOpt}`);
        addWay(correctOpt);
        stepInsertValues(isU);
      } else {
        btn.classList.add('wrongb');
        wrong(d, 'Das ist nicht die korrekte Formel.');
      }
    };
  });
}

function stepInsertValues(isU) {
  let bodyHTML = '';
  if (isU) {
    bodyHTML = `<div class="eq"><span>u =</span><input class="n" id="v1"><span>+</span><input class="n" id="v2"><span>+</span><input class="n" id="v3"><button class="check" id="insBtn">Prüfen</button></div>`;
  } else {
    bodyHTML = `<div class="eq"><span>A =</span><div class="frac"><div class="frac-top"><input class="n" id="v1"><span>·</span><input class="n" id="v2"></div><div class="frac-bot"><input class="n" value="2" id="vBot" style="width:45px"></div></div><button class="check" id="insBtn">Prüfen</button></div>`;
  }

  const d = addStep(4, 'Zahlen in die Formel einsetzen', `<p>Trage die Werte aus der Skizze ein:</p>` + bodyHTML);

  $('#insBtn').onclick = () => {
    if (isU) {
      const v1 = parseNum($('#v1').value);
      const v2 = parseNum($('#v2').value);
      const v3 = parseNum($('#v3').value);
      const vals = [v1, v2, v3].filter(x => !isNaN(x)).sort((x,y)=>x-y);
      const exp = [task.a, task.b, task.c].sort((x,y)=>x-y);
      if (vals.length === 3 && Math.abs(vals[0]-exp[0]) < 0.05 && Math.abs(vals[1]-exp[1]) < 0.05 && Math.abs(vals[2]-exp[2]) < 0.05) {
        right(d, 'Richtig eingesetzt!');
        addWay(`u = ${fmt(task.a)} + ${fmt(task.b)} + ${fmt(task.c)}`);
        stepCalculateMain(true);
      } else {
        wrong(d, 'Vergleiche die Eingaben mit den Kantenlängen.');
      }
    } else {
      const t1 = parseNum($('#v1').value);
      const t2 = parseNum($('#v2').value);
      const bot = parseNum($('#vBot').value);
      const exp1 = task.type === 'right' ? task.a : task.c;
      const exp2 = task.type === 'right' ? task.b : task.h;
      const topOk = (Math.abs(t1 - exp1) < 0.05 && Math.abs(t2 - exp2) < 0.05) || (Math.abs(t1 - exp2) < 0.05 && Math.abs(t2 - exp1) < 0.05);
      if (topOk && bot === 2) {
        right(d, 'Sehr gut eingesetzt!');
        addWay(`A = (${fmt(exp1)} · ${fmt(exp2)}) / 2`);
        stepCalculateMain(false);
      } else {
        wrong(d, 'Überprüfe Zähler und Nenner (unten muss 2 stehen).');
      }
    }
  };
}

function stepCalculateMain(isU) {
  const stepNum = $('#steps').children.length + 1;
  const targetVal = isU ? task.u : task.A;
  const unitStr = isU ? task.unit : task.unit + '²';

  const d = addStep(stepNum, isU ? 'Umfang u berechnen' : 'Flächeninhalt A berechnen', 
    `<p>Rechne das Zwischenergebnis aus:</p>
     <div class="eq"><span>${isU ? 'u' : 'A'} =</span><input class="n wide" id="resInp"><span>${unitStr}</span><button class="check" id="resBtn">Prüfen</button></div>`);

  $('#resBtn').onclick = () => {
    const val = parseNum($('#resInp').value);
    if (Math.abs(val - targetVal) < 0.05) {
      right(d, `Korrekt! ${isU ? 'u' : 'A'} = ${fmt(targetVal)} ${unitStr}`);
      addWay(`${isU ? 'u' : 'A'} = ${fmt(targetVal)} ${unitStr}`);
      
      if (task.convertToM2) {
        stepConvertM2();
      } else if (task.multiplier) {
        stepMultiplier();
      } else {
        stepCalcCost();
      }
    } else {
      wrong(d, 'Rechenfehler. Überprüfe deine Rechnung.');
    }
  };
}

function stepConvertM2() {
  const aM2 = task.A / 10000;
  const d = addStep(5, 'Umrechnung in m²', 
    `<p>Rechne A = ${fmt(task.A)} cm² in m² um (durch 10 000 teilen):</p>
     <div class="eq"><span>A =</span><input class="n wide" id="m2Inp"><span>m²</span><button class="check" id="m2Btn">Prüfen</button></div>`);

  $('#m2Btn').onclick = () => {
    const val = parseNum($('#m2Inp').value);
    if (Math.abs(val - aM2) < 0.005) {
      right(d, `Richtig! A = ${fmt(aM2)} m²`);
      addWay(`A = ${fmt(aM2)} m²`);
      if (task.multiplier) stepMultiplier();
      else stepCalcCost();
    } else {
      wrong(d, `Teile ${fmt(task.A)} durch 10 000.`);
    }
  };
}

function stepMultiplier() {
  const singleM2 = task.convertToM2 ? task.A / 10000 : task.A;
  const totalM2 = singleM2 * task.multiplier;
  const d = addStep(6, 'Gesamtfläche berechnen', 
    `<p>Multipliziere mit der Anzahl der Flächen (${task.multiplier}):</p>
     <div class="eq"><span>A_gesamt =</span><input class="n wide" id="multiInp"><span>m²</span><button class="check" id="multiBtn">Prüfen</button></div>`);

  $('#multiInp').onclick = () => {
    const val = parseNum($('#multiInp').value);
    if (Math.abs(val - totalM2) < 0.05) {
      right(d, `Gesamte Fläche = ${fmt(totalM2)} m²`);
      addWay(`A_gesamt = ${fmt(totalM2)} m²`);
      stepCalcCost();
    } else {
      wrong(d, `Multipliziere ${fmt(singleM2)} mit ${task.multiplier}.`);
    }
  };
}

function stepCalcCost() {
  const stepNum = $('#steps').children.length + 1;
  const d = addStep(stepNum, 'Kostenberechnung & Antwort', 
    `<p>Berechne die Endkosten (${fmt(task.costPerUnit)} ${task.costUnit} pro Einheit):</p>
     <div class="eq"><span>Kosten =</span><input class="n wide" id="cInp"><span>€</span><button class="check" id="cBtn">Prüfen</button></div>`);

  $('#cBtn').onclick = () => {
    const val = parseNum($('#cInp').value);
    if (Math.abs(val - task.totalCost) < 0.1) {
      right(d, `Perfekt! ${task.costName} = ${fmt(task.totalCost)} €`);
      
      const calcLine = `Rechnung: ${task.costType === 'u' ? fmt(task.u) : (task.convertToM2 ? fmt(task.A/10000) : fmt(task.A))} · ${fmt(task.costPerUnit)} = ${fmt(task.totalCost)} €`;
      addWay(calcLine);
      addWay(`Antwort: ${task.answerText} ${fmt(task.totalCost)} €.`);
      
      addWay(`Ergebnis: ${fmt(task.totalCost)} €`, 'final');
      finish();
    } else {
      wrong(d, `Multipliziere den Wert mit dem Preis von ${fmt(task.costPerUnit)} €.`);
    }
  };
}

function finish() {
  state.solved++;
  if (task.errors === 0) state.perfect++;
  state.idx++;
  
  state.log.push({
    title: task.title,
    section: task.section,
    res: fmt(task.totalCost) + ' €',
    calc: task.costType === 'u' ? `${fmt(task.u)} · ${fmt(task.costPerUnit)} = ${fmt(task.totalCost)} €` : `${fmt(task.A)} · ${fmt(task.costPerUnit)} = ${fmt(task.totalCost)} €`,
    answer: `${task.answerText} ${fmt(task.totalCost)} €.`,
    errors: task.errors,
    time: Math.round((Date.now() - task.t0) / 1000) + 's'
  });

  saveToLocalStorage();
  updateScore();

  const code = generateCode();
  const isFinalEnd = state.idx >= TOTAL_TASKS;

  let btnText = 'Nächste Aufgabe';
  if (state.idx === 6) btnText = 'Zu den Hausübungen (HÜ 1–4)';
  else if (isFinalEnd) btnText = 'Zur Gesamtauswertung';

  $('#doneText').innerHTML = (task.errors === 0 
    ? '<b>Perfekt gelöst ohne Fehler!</b>' 
    : `Aufgabe geschafft mit ${task.errors} Fehlversuch(en).`) + 
    `<div class="homework-box">
       <h4>📝 Schulheft-Eintrag</h4>
       <p>Übertrage die Aufgabe sauber in dein Heft (Angabe, Skizze, Formeln, Einsetzen, Nebenrechnung/Kosten und den vollständigen Antwortsatz).</p>
       <hr style="border:0; border-top:1px dashed var(--pen); margin:8px 0;">
       <p style="margin:0; font-size:14px;">Dein aktueller <b>Geräte-Wechsel-Code</b>:</p>
       <div class="codebox">${code}</div>
     </div>`;

  $('#nextBtn').textContent = btnText;
  $('#done').hidden = false;
}

function showSummary() {
  closeKeypad();
  const s = $('#summary');
  let rows = state.log.map((l, i) => 
    `<tr><td>${i+1}</td><td>${l.section}</td><td>${l.title}</td><td><b>${l.res}</b><br><span style="font-size:13px; color:var(--muted);">${l.calc}</span></td><td><i>${l.answer}</i></td><td>${l.errors}</td></tr>`
  ).join('');

  s.innerHTML = `
    <h2>Zusammenfassung für ${state.name || 'Schüler/in'}</h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Nr.</th><th>Teil</th><th>Aufgabe</th><th>Zusatzrechnung / Kosten</th><th>Vollständiger Antwortsatz</th><th>Fehler</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="homework-box">
      <h4>Super gemacht!</h4>
      <p>Du hast alle 6 Schulübungen und 4 Hausübungen erfolgreich inklusive vollständiger Antwortsätze bearbeitet.</p>
    </div>
    <br>
    <button class="next" onclick="location.reload()">Neustarten</button>
  `;

  $('.grid').hidden = true;
  $('.controls').hidden = true;
  $('#score').hidden = true;
  s.hidden = false;
}

$('#nameOk').onclick = () => {
  const name = $('#name').value.trim();
  if (!name) { alert('Bitte gib deinen Namen ein.'); return; }
  state.name = name;
  state.nameLocked = true;
  $('#name').disabled = true;
  $('#nameOk').hidden = true;
  
  const saved = localStorage.getItem('dreieck_sach_app_' + name.toLowerCase().replace(/\s+/g, ''));
  if (saved) {
    if (confirm('Gespeicherten Stand für "' + name + '" laden?')) {
      const data = JSON.parse(saved);
      state.solved = data.solved;
      state.perfect = data.perfect;
      state.idx = data.idx;
      state.log = data.log;
    }
  }

  updateScore();
  if (task && task.waiting) {
    task.waiting = false;
    $('#steps').innerHTML = '';
    newTask();
  }
};

$('#codeOk').onclick = () => {
  const codeVal = $('#codeInp').value.trim();
  if (!codeVal) { alert('Bitte gib einen Code ein.'); return; }
  
  let found = false;
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith('dreieck_sach_app_')) {
      const data = JSON.parse(localStorage.getItem(key));
      state.name = data.name;
      if (String(generateCode()) === codeVal) {
        state.solved = data.solved;
        state.perfect = data.perfect;
        state.idx = data.idx;
        state.log = data.log;
        state.nameLocked = true;
        $('#name').value = data.name;
        $('#name').disabled = true;
        $('#nameOk').hidden = true;
        found = true;
        break;
      }
    }
  }

  if (found) {
    alert('Fortschritt geladen! Willkommen zurück, ' + state.name + '.');
    updateScore();
    if (task && task.waiting) {
      task.waiting = false;
      $('#steps').innerHTML = '';
      newTask();
    }
  } else {
    alert('Ungültiger Code.');
  }
};

$('#nextBtn').onclick = () => {
  if (state.idx >= TOTAL_TASKS) showSummary();
  else newTask();
};

newTask();
</script>
</body>
</html>
